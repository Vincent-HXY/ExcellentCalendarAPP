version: 2
release_status: active

canonical_json:
  encoding: UTF-8
  container: array
  whitespace: none
  string_escaping: RFC_8259
  integer_format: base_10_without_leading_zero
  array_order: significant
  method_normalization: unique_then_sort_by_unicode_code_point
  note: >-
    UUID names are the UTF-8 bytes of the exact compact JSON arrays below.
    Object-key sorting is intentionally avoided. All UUID text is lowercase.

namespaces:
  occurrence:
    uuid: 2fa8ebd0-958e-5eae-83d1-1aa5da893415
    derived_from: UUIDv5(DNS, "excellent-calendar.local/contract-v2/occurrence")
  reminder:
    uuid: 57b84799-6049-567e-8f29-ae597c333140
    derived_from: UUIDv5(DNS, "excellent-calendar.local/contract-v2/reminder")
  delivery:
    uuid: 74f9acf9-a4ce-59d1-9934-5cd7ce796976
    derived_from: UUIDv5(DNS, "excellent-calendar.local/contract-v2/delivery")

identities:
  occurrence:
    algorithm: UUIDv5
    namespace: occurrence
    timed_name: '[event_id, recurrence_revision, original_local_start_datetime]'
    all_day_name: '[event_id, recurrence_revision, original_local_start_date]'
    notes:
      - original_local_start_datetime has second precision and no UTC offset.
      - The timed value is captured before DST gap/fold resolution.
      - C++ is the only producer; Dart and Kotlin only transport the result.
  recurring_reminder:
    algorithm: UUIDv5
    namespace: reminder
    name: '[target_id, recurrence_revision, occurrence_key, advance_minutes, canonical_methods]'
    notes:
      - message is not part of identity.
      - Contract v2 recurring reminders require canonical_methods to equal ["popup"].
  reminder_delivery:
    algorithm: UUIDv5
    namespace: delivery
    name: '[reminder_id, method]'
  recovery_summary_delivery:
    algorithm: UUIDv5
    namespace: delivery
    name: '["recovery_summary", recovery_batch_id, "popup"]'

test_vectors:
