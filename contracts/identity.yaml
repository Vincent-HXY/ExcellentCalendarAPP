identities:
  occurrence:
    algorithm: UUIDv5
    namespace: occurrence
    timed_name: '[event_id, recurrence_revision, original_local_start_datetime]'
    all_day_name: '[event_id, recurrence_revision, original_local_start_date]'
    notes:
      - original_local_start_datetime has second precision and no UTC offset.
      - The timed value is captured before DST gap/fold resolution.
      - C++ is the only producer; Dart and Kotlin only transport the result.
  recurring_reminder:
    algorithm: UUIDv5
    namespace: reminder
    name: '[target_id, recurrence_revision, occurrence_key, advance_minutes, canonical_methods]'
    notes:
      - message is not part of identity.
      - Contract v2 recurring reminders require canonical_methods to equal ["popup"].
  snoozed_reminder:
    algorithm: UUIDv5
    namespace: reminder
    name: '[source_delivery_id, "snooze", 10]'
    notes:
      - The integer 10 is the frozen snooze duration in minutes and is never supplied by Dart or Kotlin.
      - The first successful workflow call stores remind_at from the C++ Clock plus 10 minutes.
      - Replays return the same stored Reminder and never recompute remind_at from a later Clock value.
  reminder_delivery:
    algorithm: UUIDv5
    namespace: delivery
    name: '[reminder_id, method]'
  recovery_summary_delivery:
    algorithm: UUIDv5
    namespace: delivery
    name: '["recovery_summary", recovery_batch_id, "popup"]'
  anniversary_occurrence:
    algorithm: UUIDv5
    namespace: anniversary_occurrence
    name: '[anniversary_id, occurrence_date]'
    notes:
      - occurrence_date is exact zero-padded YYYY-MM-DD in the requested local calendar.
      - title, note, category_id, importance, timezone, and recurrence_id are excluded.
      - Restoring the same Anniversary date restores the same deterministic occurrence identity.
  anniversary_reminder_template:
    algorithm: UUIDv5
    namespace: anniversary_reminder_template
    name: '[anniversary_id, advance_days, local_time, "follow_device", "popup"]'
    notes:
      - local_time is exact zero-padded HH:mm; is_enabled is deliberately excluded.
      - V1 has exactly follow_device and popup; changing advance_days or local_time changes identity.
  anniversary_reminder:
    algorithm: UUIDv5
    namespace: anniversary_reminder
    name: '["anniversary", anniversary_id, occurrence_key, template_key]'
    notes:
      - remind_at, message, title, note, category, importance, and scheduler state are excluded.
  anniversary_catch_up_delivery:
    algorithm: UUIDv5
    namespace: anniversary_catch_up_delivery
    name: '["anniversary_catch_up", anniversary_id, occurrence_key, covered_reminder_ids_sorted, "popup"]'
    notes:
      - covered_reminder_ids_sorted is a JSON array of canonical lowercase UUID strings sorted by Unicode code point.
      - Membership is frozen in ReminderRecoveryBatch before prepare and cannot accept later candidates.
  habit_occurrence:
    algorithm: UUIDv5
    namespace: habit_occurrence
    name: '[habit_id, template_key, occurrence_date]'
    notes:
      - occurrence_date is exact zero-padded device-local YYYY-MM-DD.
      - template_key is the active C++-generated UUIDv4 template identity.
      - timezone, local_time, remind_at, title, target amount, and scheduler state are excluded.
      - Changing reminder local_time replaces template_key and therefore creates a new occurrence identity chain.
      - Occurrence identity is not the daily-display quota. Across all template_key values, one habit_id plus occurrence_date may have at most one real sent display.
  habit_reminder:
    algorithm: UUIDv5
    namespace: habit_reminder
    name: '["habit", habit_id, template_key, occurrence_date]'
    notes:
      - The tuple is also the persistent business uniqueness key for a Habit Reminder.
      - Same tuple and same content replay idempotently; conflicting content fails.
      - A sent or conservatively reserved prepared display is never recreated for the same habit_id plus occurrence_date, even after CheckIn clear or template replacement.
  habit_notification_action:
    algorithm: UUIDv5
    namespace: habit_notification_action
    name: '["habit_complete", habit_id, check_date, occurrence_key]'
    notes:
      - The action is a set-to-done operation, never an increment.
      - Binary completion stores done; quantitative completion stores the current target snapshot and done.
      - Acceptance requires habit_id, check_date, occurrence_key, and action_id to match and check_date to equal the current device-local date.

