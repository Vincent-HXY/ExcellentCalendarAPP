event_channels:
  reminder.status_changed:
    module: reminder
    channel: excellent_calendar/events/reminder
    data: reminder/reminder_response.schema.json

  notification.delivered:
    module: notification
    channel: excellent_calendar/events/notification
    data: notification/notification_response.schema.json

  notification.opened:
    module: notification
    channel: excellent_calendar/events/notification_opened
    data: notification/notification_tap_payload.schema.json

  ring.state_changed:
    module: ring
    channel: excellent_calendar/events/ring_state
    implementation_status: integrated
    release_status: active
    data: ring/ring_state_changed_event.schema.json
    identity:
      - state.runtime_instance_id
      - state.sequence
    ordering: sequence_strictly_increasing_per_runtime_instance
    duplicate_delivery: allowed
    recovery: subscribe_then_ring.get_state
