event_channels:
  reminder.status_changed:
    module: reminder
    channel: excellent_calendar/events/reminder
    data: reminder/reminder_response.schema.json

  notification.delivered:
    module: notification
    channel: excellent_calendar/events/notification
    data: notification/notification_response.schema.json

  notification.opened:
