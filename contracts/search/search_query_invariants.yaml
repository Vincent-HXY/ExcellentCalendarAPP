version: 2
contract_version: 2
implementation_status: integrated
release_status: active

revision_history:
  revision_1: withdrawn_before_any_production_reader_or_writer
  revision_2: event_time_and_status_pagination_cursor_and_history_failure_semantics_closed
  revision_2_amendment_2026_09_02: completed_recurring_series_cutoff_aligned_with_calendar_before_release
  release_activation_2026_09_02: product_owner_accepted_open_search_accessibility_and_signing_debt

projection:
  kind: read_only_composite
  source_of_truth: canonical_sqlite_v5_stores
  persists_search_results: false
  persists_relevance: false
  persists_snippets: false
  localized_text_on_wire: false
  one_logical_item_per_section: true
  section_order: [event, habit, anniversary]
  first_version_uses_fts: false

keyword:
  maximum_unicode_scalar_values: 128
  maximum_utf8_bytes: 512
  reject_empty_after_normalization: true
  reject_isolated_utf16_surrogates: true
  normalization:
    trim_frozen_unicode_whitespace: true
    collapse_frozen_unicode_whitespace_to_ascii_space: true
    preserve_original_non_whitespace_scalars: true
    unicode_normalization_form: none
    comparison_case_rule: ascii_A_Z_to_a_z_only
    full_unicode_case_folding: false
  frozen_whitespace_code_points:
    - U+0009..U+000D
    - U+0020
    - U+0085
    - U+00A0
    - U+1680
    - U+2000..U+200A
    - U+2028
    - U+2029
    - U+202F
    - U+205F
    - U+3000
  tokenization: split_normalized_keyword_on_U+0020
  token_operator: AND
  chinese_match: exact_contiguous_substring_per_token
  searchable_field_whitespace_normalization: same_frozen_trim_and_collapse_rule

matching:
  event_fields: [title, content, location, category_name]
  habit_fields: [title, description, category_name]
  anniversary_fields: [title, note, category_name]
  excluded_fields:
    event: [id, reminder, recurrence_text, source]
    habit: [check_in_identity, statistics, reminder_template, unit]
    anniversary: [recurrence_identity, countdown_number, reminder_technical_fields]
  relevance_tiers:
    - title_exact
    - title_prefix
    - title_contiguous_query
    - every_token_in_title
    - body_like
    - location
    - category_name
  cross_field_rule: >-
    Every token chooses its highest-precedence matching allowed field. Unless one
    of the four title-wide tiers applies, the item's tier is the lowest-precedence
    chosen token field, so a token that only matches Category cannot inherit a
    better tier from another title token.
  matched_fields_order: allowed_field_precedence_then_wire_enum_order
  matched_category_name_requires_non_null_current_category: true
  matched_event_location_requires_non_null_location: true
  primary_field: field_that_determines_the_observable_relevance_tier
  snippet:
    maximum_unicode_scalar_values: 200
    required_when_primary_field_is_not_title: true
    forbidden_when_primary_field_is_title: true
    field_must_equal_primary_field: true
    must_not_split_unicode_scalar_or_utf16_surrogate_pair: true
    ellipsis_is_flutter_presentation_from_truncation_flags: true
    need_not_contain_every_cross_field_token: true

category_filter:
  unrestricted: {category_ids: null, include_uncategorized: false}
  only_uncategorized: {category_ids: [], include_uncategorized: true}
  selected_ids: non_empty_unique_category_ids_with_optional_uncategorized
  empty_ids_without_uncategorized: invalid
  maximum_category_ids: 100
  structured_match_source: target_objects_opaque_category_id
  uncategorized_definition: target_objects_category_id_is_null
  missing_or_deleted_category_is_not_uncategorized_when_reference_non_null: true
  display_and_text_match_source: current_active_category_only
  stale_category_name_match_forbidden: true

date_filter:
  wire_interval: half_open_local_date
  both_bounds_null_means_unrestricted: true
  partial_bounds_invalid: true
  empty_or_reversed_invalid: true
  ui_inclusive_end_converted_by_flutter: true
  date_only_never_converted_to_utc_midnight: true
  timezone: validated_IANA_identifier
  request_timezone_owns_timed_filter_window: true
  event_timezone_does_not_reinterpret_request_filter: true

query_shape:
  query_generation:
    owner: flutter_application
    wire_type: safe_non_negative_integer
    response_echo_exactly: true
    cursor_binding: false
    canonical_store_generation: false
  target_types_order: [event, habit, anniversary]
  target_types_must_be_unique_and_canonical_order: true
  section_target_must_belong_to_target_types: true
  section_targets_must_be_unique_and_canonical_order: true
  multi_section_request_requires_all_cursors_null: true
  multi_section_request_sections_equal_target_types: true
  continuation_request_contains_exactly_one_section: true
  response_contains_exactly_requested_sections_even_when_total_zero: true

snapshot:
  token_prefix: srchsnap1
  token_pattern: '^srchsnap1\.[A-Za-z0-9_-]{20,512}$'
  token_max_length: 522
  one_sqlite_read_transaction_per_query: true
  one_fixed_cpp_clock_instant_per_query: true
  contributing_stores_by_target:
    event: [events, recurrence_versions, event_occurrence_states, categories]
    habit: [habits, habit_recurrences, categories]
    anniversary: [anniversaries, anniversary_recurrences, categories]
  excludes_unprojected_stores:
    - habit_check_ins
    - reminders
    - notifications
    - reminder_templates
  initial_multi_section_response_uses_one_token: true
  initial_token_covers_union_of_requested_target_stores: true
  continuation_cursor_binds_requested_target_store_generations: true
  unrelated_target_store_mutation_does_not_expire_section_cursor: true
  changed_generation_returns: SEARCH_CURSOR_EXPIRED
  token_is_authenticated: true
  authentication_profile: search_runtime_hmac_sha256

pagination:
  default_page_size: 20
  maximum_page_size: 20
  fixed_v1_page_size: 20
  exact_total_count: true
  cursor_prefix: srchcur1
  cursor_pattern: '^srchcur1\.[A-Za-z0-9_-]{20,2048}$'
  cursor_max_length: 2057
  cursor_sort_revision: 2
  cursor_is_authenticated_opaque_payload: true
  authentication:
    profile: search_runtime_hmac_sha256
    algorithm: HMAC-SHA-256
    tag_bytes: 32
    wire_token: '<prefix>.<base64url_without_padding(payload_bytes || tag_bytes)>'
    mac_input: 'ascii(domain_separator) || 0x00 || payload_bytes'
    strict_base64url_canonical_encoding: true
    padding_forbidden: true
    tag_is_final_32_decoded_bytes: true
    payload_encoding: canonical_versioned_length_prefixed_binary
    payload_version_byte: 1
    payload_owner: cpp_native_runtime_only
    dart_and_kotlin_treat_payload_as_opaque: true
    payload_must_bind_every_cursor_binds_field: true
    cursor_domain_separator: excellent-calendar/search-cursor/v1
    snapshot_domain_separator: excellent-calendar/search-snapshot/v1
    key_owner: process_native_runtime
    key_bytes: 32
    key_entropy: operating_system_csprng
    key_persisted: false
    key_rotates_on_native_runtime_process_start: true
    cursor_from_previous_process_returns: SEARCH_CURSOR_INVALID
    verification_order: decode_bounds_then_constant_time_tag_then_payload_semantics
    constant_time_tag_comparison: true
    deterministic_key_injection: tests_only
    key_generation_failure: fail_search_runtime_with_NATIVE_INTERNAL_ERROR
    bare_json_fnv_or_calendar_checksum_reuse_forbidden: true
  cursor_binds:
    - normalized_keyword_comparison_key
    - target_types
    - date_from
    - date_to_exclusive
    - category_ids_and_uncategorized_mode
    - include_completed
    - sort_by
    - requested_target_type
    - timezone
    - page_size
    - contract_version
    - cursor_sort_revision
    - evaluated_at
    - complete_last_sort_key
    - canonical_store_snapshot_token
  terminal_page_next_cursor: null
  non_terminal_requires_non_empty_items: true
  target_identity_unique_across_pages: true
  repeated_or_non_advancing_cursor_is_contract_failure: true
  conservation:
    response_sections_equal_requested_sections_in_same_order: true
    first_page_returns_min_total_and_page_size_items: true
    continuation_returns_min_remaining_and_page_size_items: true
    has_more_iff_accumulated_unique_items_less_than_total_count: true
    terminal_accumulated_unique_items_equals_total_count: true
    total_count_constant_for_cursor_chain: true
    cursor_chain_never_repeats_or_moves_backwards: true
    continuation_response_section_equals_request_section: true
    continuation_timezone_equals_initial_timezone: true
    continuation_evaluated_at_equals_initial_evaluated_at: true
    continuation_snapshot_token_equals_initial_snapshot_token: true
    response_query_generation_echoes_each_page_request: true

event:
  hidden_series_statuses: [cancelled, archived]
  soft_deleted_hidden: true
  occurrence_cancelled_hidden: true
  closed_item_statuses: [completed, skipped]
  include_completed_false_excludes_closed_items: true
  completed_recurring_series_cutoff_source: contracts/calendar/calendar_query_invariants.yaml#/sections/event/completed_recurring_series_cutoff
  completed_recurring_series_cutoff:
    cutoff: occurrence_anchor_strictly_before_event_completed_at
    timed_occurrence_anchor: occurrence_start_at
    all_day_occurrence_anchor: occurrence_start_date_start_of_day_resolved_in_recurrence_timezone
    occurrence_starting_exactly_at_cutoff_is_excluded: true
    occurrence_starting_before_cutoff_retains_full_original_interval: true
    retained_occurrence_projects_as: completed
  status_projection_source: contracts/calendar/calendar_query_invariants.yaml#/sections/event/status_projection
  status_projection:
    clock: snapshot_token_evaluation_clock_utc
    explicit_occurrence_state_precedence: [completed, skipped]
    non_recurring_completed_event_projects_as: completed
    active_timed:
      pending: query_clock_before_actual_start_at
      in_progress: query_clock_at_or_after_actual_start_at_and_before_actual_end_at
      overdue: query_clock_at_or_after_actual_end_at
    active_all_day:
      comparison_date: query_clock_converted_to_requested_timezone_local_date
      pending: comparison_date_before_actual_start_date
      in_progress: comparison_date_at_or_after_actual_start_date_and_before_actual_end_date
      overdue: comparison_date_at_or_after_actual_end_date
    comparison_intervals_are_half_open: true
  reopened_projection:
    non_recurring_event_status_active_uses_dynamic_clock_projection: true
    recurring_occurrence_state_scheduled_uses_dynamic_clock_projection: true
    reopened_is_never_a_permanent_pending_override: true
  date_range_overlap:
    recurring_timed_occurrence_expansion_timezone: event_timezone
    non_recurring_timed_facts: stored_UTC_start_at_and_end_at
    timed_query_window: >-
      Resolve date_from at 00:00 and date_to_exclusive at 00:00 in the request
      timezone, producing one half-open UTC instant window.
    local_boundary_resolver: bundled_tzdb_runtime_resolve_local_datetime
    nonexistent_local_boundary: first_valid_instant_after_gap
    ambiguous_local_boundary: earlier_instant
    timed_overlap_formula: actual_start_at_lt_query_end_at_and_actual_end_at_gt_query_start_at
    cross_midnight_and_multi_day_timed_use_same_formula: true
    all_day_query_window: direct_half_open_civil_date_interval
    all_day_overlap_formula: actual_start_date_lt_date_to_exclusive_and_actual_end_date_gt_date_from
    all_day_dates_never_shift_with_request_or_event_timezone: true
  selected_occurrence:
    no_date_filter: current_or_next_open_else_most_recent_closed_or_past
    completed_series_without_date_filter: last_eligible_occurrence_strictly_before_cutoff
    completed_series_without_eligible_occurrence: event_not_returned
    with_date_filter: nearest_eligible_overlapping_occurrence_to_requested_timezone_today
    eligibility_applied_before_distance:
      - hidden_series_and_cancelled_occurrence_removed
      - completed_recurring_series_cutoff_applied
      - occurrence_must_overlap_requested_date_window
      - include_completed_false_removes_completed_and_skipped
    occurrence_state_cannot_restore_cutoff_ineligible_occurrence: true
    distance: >-
      Natural-day distance from request-timezone today to the occurrence's
      occupied local-date interval; zero when today is inside that interval.
    occupied_local_date_interval:
      timed: >-
        Convert the actual half-open start/end instants to the request timezone;
        an end exactly at local midnight does not occupy the ending date.
      all_day: stored_half_open_start_date_and_end_date_without_timezone_shift
    open_status_is_not_a_selection_precedence_when_include_completed_true: true
    tie_break:
      - distance_asc
      - current_or_future_interval_before_past_interval
      - actual_local_start_asc
      - recurrence_revision_asc
      - occurrence_key_asc
    recurring_navigation_fields: [target_id, recurrence_revision, occurrence_key, occur_at_or_occur_date]
    one_time_navigation_fields: [target_id]
  timed_interval: half_open_UTC_instant
  all_day_interval: half_open_local_date
  temporal_projection:
    timed_current: evaluated_at_inside_half_open_actual_interval_bucket_0_distance_0
    timed_future: evaluated_at_before_start_bucket_0_distance_start_minus_evaluated_at
    timed_past: evaluated_at_at_or_after_end_bucket_1_distance_evaluated_at_minus_end
    all_day_current: requested_timezone_today_inside_half_open_date_interval_bucket_0_distance_0
    all_day_future: today_before_start_date_bucket_0_distance_start_date_minus_today
    all_day_past: today_at_or_after_end_date_bucket_1_distance_today_minus_last_occupied_date
    completion_bucket_is_independent_from_temporal_bucket: true

habit:
  soft_deleted_hidden: true
  include_completed_true_lifecycle: [upcoming, active, completed, ended_early]
  include_completed_false_lifecycle: [upcoming, active]
  daily_check_in_status_affects_lifecycle_filter: false
  effective_interval: inclusive_start_and_effective_end_local_dates
  selected_occur_date: closest_date_to_requested_timezone_today_inside_filter_intersection_or_effective_interval
  completed_or_ended_remaining_days: 0

anniversary:
  supported_calendar_type: solar
  soft_deleted_hidden: true
  include_completed_affects_result: false
  occurrence_date_only: true
  no_date_filter: next_occurrence_else_most_recent_past
  with_date_filter: closest_occurrence_to_requested_timezone_today
  leap_day_rule: existing_anniversary_domain_rule
  occurrence_identity: contracts_identity_yaml_anniversary_occurrence

sorting:
  relevance:
    - relevance_tier_asc
    - completion_bucket_asc
    - temporal_bucket_asc
    - temporal_distance_asc
    - updated_at_desc
    - target_id_asc
  occur_time:
    - temporal_bucket_asc
    - temporal_distance_asc
    - target_id_asc
  updated_at:
    - updated_at_desc
    - target_id_asc
  completion_bucket:
    open: 0
    completed_or_ended_or_skipped: 1
  temporal_bucket:
    current_or_future: 0
    past: 1
    no_business_time: 2
  temporal_distance:
    current_or_future: ascending_from_evaluated_at_or_local_today
    past: ascending_absolute_distance_from_evaluated_at_or_local_today
  mixed_event_time_rule: compare_requested_timezone_local_date_then_all_day_before_local_time_without_converting_date_only_to_instant

history:
  implementation: kotlin_atomic_file_in_no_backup_directory
  public_methods: [search.get_local_history, search.replace_local_history]
  native_call_exists: false
  storage_format_version: 1
  base_file: excellent_calendar_search_history_v1.json
  directory: Context.noBackupFilesDir
  shared_preferences_forbidden: true
  writer: android.util.AtomicFile
  process_singleton_store_and_explicit_lock: true
  publish_new_in_memory_snapshot_only_after_finishWrite_success: true
  startWrite_or_write_or_finishWrite_failure_calls_failWrite_and_keeps_previous_snapshot: true
  reads_recover_atomic_backup_before_decode: true
  maximum_items: 20
  stored_values: normalized_display_keywords_only
  identity_key: ascii_case_insensitive_normalized_keyword
  duplicate_behavior: newest_display_spelling_moves_to_front
  ordering: most_recent_first
  replace_semantics: atomic_compare_and_replace_complete_ordered_list
  revision:
    initial: 0
    maximum: 9007199254740991
    increment_only_when_list_changes: true
    mismatch_error: SEARCH_HISTORY_CONFLICT
    never_wrap: true
    unchanged_at_maximum_succeeds_without_write: true
    changed_at_maximum_returns_SEARCH_HISTORY_STORAGE_FAILED_without_write: true
    repair_requiring_revision_increment_at_maximum_returns_SEARCH_HISTORY_STORAGE_FAILED_without_write: true
  empty_items_clears: true
  corrupt_known_version: normalize_deduplicate_keep_order_cap_and_atomically_repair
  unknown_future_version: preserve_bytes_and_return_SEARCH_HISTORY_STORAGE_FAILED
  durable_write_failure: SEARCH_HISTORY_STORAGE_FAILED
  recording:
    debounce_success: never
    keyboard_submit_success_including_zero_results: record_response_normalized_keyword
    keyboard_submit_failure: do_not_record
    history_tap: immediately_move_stored_canonical_keyword_to_front_then_query
    history_reorder_failure: query_still_runs_and_failure_is_non_blocking
    result_open_from_accepted_response: record_response_normalized_keyword_before_navigation
    duplicate_record_is_idempotent_without_revision_increment: true
  log_keyword_or_raw_payload: false
  excluded_from_android_cloud_backup: true
  excluded_from_android_device_transfer: true
  account_id_stored: false
  sync_metadata_stored: false

compatibility:
  search_contract_revision: 2
  revision_1_was_never_shipped: true
  native_contract_change: additive_v2
  previous_search_reader_or_writer_exists: false
  event_search_unchanged: true
  canonical_fact_schema_changed: false
  sqlite_storage_version_changed: false
  search_index_or_fts_migration: deferred_until_performance_gate_failure
  capability_before_real_integration: planned_and_blocked

errors:
  invalid_keyword_filter_date_or_section: SEARCH_QUERY_INVALID
  invalid_timezone: TIMEZONE_ID_INVALID
  malformed_or_unauthenticated_cursor: SEARCH_CURSOR_INVALID
  cursor_query_mismatch: SEARCH_CURSOR_QUERY_MISMATCH
  changed_store_generation: SEARCH_CURSOR_EXPIRED
  history_revision_mismatch: SEARCH_HISTORY_CONFLICT
  history_read_repair_durable_write_or_revision_exhaustion: SEARCH_HISTORY_STORAGE_FAILED
  malformed_request_shape: CONTRACT_VALIDATION_FAILED
  sqlite_failure: STORAGE_IO_ERROR
  malformed_canonical_data: STORAGE_DATA_CORRUPTED
