version: 1
contract_domain: backend_api
version_domain: backend_api/v1
compatibility_revision: sync-v1
base_path: /api/v1
transport: https
implementation_status: planned
release_status: planned
preserved_revision: ../backend_api.yaml
rule_anchor: cloud-sync-02/3,8.1
http_conventions:
  success_status: 200
  application_error_http_statuses:
  - 400
  - 401
  - 403
  - 404
  - 409
  - 429
  - 500
  - 503
  application_errors_require_valid_envelope: true
  http_status_must_match_error_mapping: true
  non_envelope_failure: transport_or_protocol_failure_no_fabricated_business_code
  unknown_fields: reject
  scalar_coercion: reject_numeric_string_boolean_null_coercion
  idempotency_payload_mismatch:
    http_status: 409
    code: API_IDEMPOTENCY_KEY_REUSED
  retry_after: optional integral Retry-After header must exactly mirror legal 1..86400
    body seconds; mismatch invalidates envelope
  retryable_http_statuses:
  - 429
  - 500
  - 502
  - 503
  - 504
  transport_retry_policy: sync/sync_protocol_invariants.yaml#/retry
  canonical_idempotency_hash: typed canonical body; avatar uses binary content hash
    plus typed operation identity; changed payload never replays a previous success
calibration:
  observed_report: ../spikes/sync_v1/backend_http_calibration_result.json
  observed_endpoint_count: 17
  existing_controller_count: 16
  observed_status_and_retry_mirror: keep actual typed HTTP status/body behavior with
    an explicit closed mapping
  implementation_differences:
  - reject ignored unknown fields and scalar coercions
  - reject reused idempotency key with different registration/avatar payload
  - restrict user.update_current to username/display_name
  - register locale constant zh-CN
  - separate profile/preferences revisions and canonical download-only profile changes
  - broker server-logout terminal adds trustworthy server_time
compatibility:
  old_leaf_schemas: unchanged and protected by baseline
  old_mobile_reader: legacy v2/v5 remains bound to old contract; sync-v1 callers select
    this revision only after the capability gate
  registration_email_update: controller absent; remains planned and unavailable until
    04 implementation and HTTP fixtures pass
  locale: old values readable through legacy_locale only; no locale selector or locale
    sync writer
  settings: no arbitrary settings map enters the new response/writer; existing backend
    JSONB is historical storage until a separately validated migration
