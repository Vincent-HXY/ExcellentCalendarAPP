event_channels:
  channel: excellent_calendar/events_v3
  envelope: native_v3/common/native_event.schema.json
  events:
    sync.status_changed:
      schema: sync/sync_status_response.schema.json
      identity:
      - workspace_id
      - runtime_instance_id
      - active_route_revision
      - status_revision
      recovery_method: sync.get_status
      delivery: may_repeat_or_drop_subscribe_then_query
    workspace.state_changed:
      schema: workspace/workspace_route_state.schema.json
      identity:
      - route_state
      - active_route_revision
      recovery_method: workspace.get_state
      delivery: may_repeat_or_drop_subscribe_then_query
    reminder.status_changed:
      schema: native_v3/events/reminder_status_changed.schema.json
      preserved_v2_event: reminder.status_changed
      identity:
      - workspace_id
      - runtime_instance_id
      - active_route_revision
      recovery_method: reminder.list
      delivery: preserve_v2_delivery_and_recovery
      implementation_status: planned
      release_status: planned
    notification.delivered:
      schema: native_v3/events/notification_delivered.schema.json
      preserved_v2_event: notification.delivered
      identity:
      - workspace_id
      - runtime_instance_id
      - active_route_revision
      recovery_method: null
      delivery: advisory_delivery_event_may_drop_no_fake_notification_list
      implementation_status: planned
      release_status: planned
    notification.opened:
      schema: native_v3/notification/notification_tap_payload_v6_writer.schema.json
      preserved_v2_event: notification.opened
      identity:
      - workspace_id
      recovery_method: notification.get_initial_tap_payload
      delivery: preserve_v2_delivery_and_recovery
      implementation_status: planned
      release_status: planned
    ring.state_changed:
      schema: native_v3/business_compat/ring/ring_state_changed_event.schema.json
      preserved_v2_event: ring.state_changed
      identity:
      - state.runtime_instance_id
      - state.sequence
      recovery_method: ring.get_state
      delivery: preserve_v2_delivery_and_recovery
      implementation_status: planned
      release_status: planned
