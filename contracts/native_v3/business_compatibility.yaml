recurrence_revision:
  wire_minimum: 1
  wire_maximum: 9007199254740991
  old_cpp_reader_maximum: 2147483647
  cpp: checked std::int64_t
  kotlin: exact Long
  dart: exact int
  java: exact long
  storage_codec_revisions: storage/calendar_core_storage.yaml#/calendar_core_v6/payload_codec_revisions
  legacy_v2_schema: unchanged; its absent maximum does not prove that the int32 production
    decoder accepts larger values
  legacy_v5: exact historical codecs and rows; four v6 metadata codec bumps authorize
    only the recurrence counter width change
  v3_dispatch: only workspace-bound v6 runtimes; never send a v6 record to the v2/v5
    int32 reader
notification:
  legacy_reader: workspace pair absent or both present; never one present/null
  v6_writer: both workspace fields required for prepared, tap and Habit action payloads;
    reminder.prepare_delivery uses writer refs recursively
  legacy_route: only a uniquely identified legacy workspace; ambiguity refuses routing;
    no target-id scan across databases
  hidden_account: unavailable until the same account is authenticated and unlockable;
    never auto-login
  guest_source_label: 本机
  upload: workspace routing is local-only and excluded from all Sync facts
