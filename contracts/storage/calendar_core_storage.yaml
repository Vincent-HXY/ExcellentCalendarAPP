  payload_codecs:
    workspace_preferences:
      columns:
        default_reminder_methods_json: sync/v1/user_preferences_fact.schema.json#/properties/default_reminder_methods
      note: Exactly the four portable fields; IANA validation is mandatory at the codec boundary. No locale, generic settings or first-day setting.
    account_profile_cache:
      columns:
        payload_json: user/account_profile_snapshot.schema.json
    sync_conflict_notice_queue:
      columns:
        conflict_ids_json: nonempty_sorted_unique_uuid_array
    sync_outbox:
      columns:
        payload_json: sync/sync_outbox_mutation.schema.json
        causal_predecessors_json: sync/sync_mutation.schema.json#/oneOf/0/properties/causal_predecessors
      cross_checks:
      - indexed columns equal mutation envelope
      - JCS hash excludes only envelope created_at
      - causal predecessor is earlier than client sequence
      - workspace_import target_id equals import_batch_id; resolution uses its single-item route; all import messages share the device sequence
    sync_prepared_requests:
      columns:
        payload_json: sync/native_prepared_exchange_request.schema.json
    sync_failed_local_changes:
      columns:
        payload_json: sync/sync_failed_change_mutation.schema.json
        local_candidate_json: target_specific_fact
        manual_draft_json: target_specific_patch
        failure_context_json: sync/sync_error_registry.yaml
    sync_entity_state:
      columns:
        field_versions_json: target_registry_merge_key_safe_integer_map
        awaiting_server_adjudication_keys_json: target_registry_unique_merge_keys
    sync_server_baselines:
      columns:
        payload_json: sync/sync_fact_after_image.schema.json
    sync_upload_receipts:
      columns:
        payload_json: sync/sync_terminal_upload_result.schema.json
    sync_conflicts:
      columns:
        payload_json: sync/sync_conflict_detail.schema.json
    sync_import_batches:
      columns:
        payload_json: sync/sync_import_manifest.schema.json
        server_status_snapshot_json: sync/import_status_response.schema.json
      state_registry: workspace/native_import_status_response.schema.json
    sync_import_items:
      columns:
        payload_json: sync/sync_mutation.schema.json
    sync_import_publish_chunks:
      columns:
        payload_json: sync/sync_import_publish_item.schema.json
    sync_import_publish_markers:
      columns:
        payload_json: sync/sync_import_publish_marker.schema.json
    sync_import_range_close_receipts:
      columns:
        payload_json: sync/import_range_close_proof.schema.json
    sync_transport_fence_receipts:
      columns:
        payload_json: sync/sync_device_fence_response.schema.json
    guest_import_execution_retirements:
      columns:
        payload_json: workspace/import_affected_execution.schema.json
      cross_checks:
      - source workspace/epoch and receipt hash equal the durable cleanup receipt; private local execution identities never enter HTTP
    sync_import_execution_cancellations:
      columns:
        payload_json: workspace/import_affected_execution.schema.json
      cross_checks:
      - copy only from authenticated local guest retirement transaction; binding and cleanup hash match this batch; status replays the same identities
        after restart
