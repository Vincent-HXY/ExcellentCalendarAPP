version: 4
release_status: active
implementation_status: integrated
format_name: excellent_calendar_core_sqlite
storage_format_version: 4
active_format_contract: calendar_core_v4
legacy_json_sections_role: migration_source_payload_codec_and_downgrade_guard_only

directories:
  active_android: files/local_storage/calendar_core_storage_json
  legacy_ignored: files/local_storage/test_storage_json
  note: >-
    The established active directory name is retained so SQLite v4 can discover
    Calendar Core JSON v1, v2, or v3 in place. calendar_core.sqlite3 is the only
    active writer. After a successful import, JSON roots retain every record but
    carry storage_version 4 as a downgrade guard and are never read as live data.
    The historical test_storage_json directory remains ignored.

compatibility:
  reads_v1: migration_only
  migrates_v1: true_into_isolated_compatibility_tables
  reads_v2: migration_only_through_frozen_v2_to_v3_codec
  reads_v3: migration_only
  migrates_v2: true_via_v3_then_sqlite_v4
  migrates_v3: true
  writes_v1: false
  writes_v2: false
  writes_v3: false
  writes_v4: sqlite_only
  mixed_read: forbidden
  additive_v2_store_policy: >-
    A new independent file may join the v2 directory without changing
    storage_format_version when existing v2 runtimes ignore unknown file names,
    existing store envelopes and codecs remain unchanged, and the new runtime
    validates rather than rewrites every pre-existing file.
  rollback: >-
    A rollback to any JSON writer is unsafe. Before SQLite is published, every
    retained JSON writer root is durably rewritten only at the envelope level
    to storage_version 4 and verified against its captured pre-cutover image.
    Older JSON runtimes must reject that guard and must not delete, downgrade,
    or partially read the directory.

calendar_core_v4:
  format_name: excellent_calendar_core_sqlite
  storage_format_version: 4
  implementation_status: integrated
  release_status: active
  directory: files/local_storage/calendar_core_storage_json
  database_file: calendar_core.sqlite3
  transient_files:
    migration_candidate: calendar_core.sqlite3.migrating
    cutover_journal: calendar_core_sqlite_cutover.json
    wal: calendar_core.sqlite3-wal
    shared_memory: calendar_core.sqlite3-shm
  sqlite:
    application_id: 0x4543414c
    user_version: 4
    journal_mode: WAL
    transaction_begin: BEGIN IMMEDIATE
    synchronous: FULL
    foreign_keys: enabled
    quick_check_on_open: required
    schema_definition_validation: >-
      Every required table and index must match the normalized canonical CREATE
      definition, including columns, primary keys, uniqueness, CHECK clauses,
      expression order, casts, and partial-index predicates. A matching object
      name alone is never sufficient.
    bundled_version: 3.53.4
  metadata_tables:
    - schema_metadata
    - store_generations
    - migration_history
  modern_tables:
    - events
    - recurrence_versions
    - event_occurrence_states
    - anniversaries
    - anniversary_recurrences
    - anniversary_reminder_templates
    - reminders
    - notifications
    - reminder_recovery_batches
    - categories
  legacy_v1_compatibility_tables:
    - legacy_events
    - legacy_reminders
    - legacy_notifications
  row_shape:
    columns: [record_key, position, payload_json]
    primary_key: record_key
    ordering: position_is_unique_non_negative_and_contiguous
    payload: >-
      Modern rows preserve one strict JSON v3 record verbatim. Compatibility
      rows preserve the frozen JSON v1 record shape. SQLite owns identity,
      ordering, uniqueness, scheduling indexes, durability, and transactions;
      the frozen codecs remain the only field decoder so no supported field is
      dropped during migration.
  native_constraints_and_indexes:
    required_uniques:
      - recurrence_id_and_revision
      - event_id_revision_and_occurrence_key
      - recurring_reminder_business_identity
      - notification_delivery_attempt_id
      - prepared_delivery_id
      - sent_delivery_id
      - recovery_request_id
      - single_recovery_batch_in_progress
      - anniversary_template_business_identity
    query_indexes:
      - reminders_is_enabled_deleted_at_status_remind_at_record_key
      - legacy_reminders_is_enabled_deleted_at_status_remind_at_record_key
      - events_deleted_at_status_start_at_start_date_record_key
      - events_category_id_deleted_at
      - notifications_reminder_id_position
      - categories_deleted_at_sort_order_created_at_record_key
  relationship_validation: >-
    SQLite foreign keys remain intentionally absent from entity rows because
    Event.category_id is a retained weak reference, target_id is polymorphic,
    and Notification/Recovery audit rows may outlive active targets. The strict
    v3 aggregate decoder validates every cross-store reference and lifecycle
    invariant before a transaction commits and whenever the database opens.
  repository_boundary: >-
    Event, Reminder, Notification, RecurringEventTransaction,
    AnniversaryTransaction, and CategoryRepository interfaces are unchanged.
    Application services never receive sqlite3 handles or a mutable giant
    Calendar state transaction.
  migration:
    migration_id_fresh: calendar_core_fresh_sqlite_v4
    migration_id_v2: calendar_core_json_v2_to_v3_anniversary_reminder_r1
    migration_id_v3: calendar_core_json_v3_to_sqlite_v4
    migration_id_v1_compatibility: calendar_core_json_v1_compat_to_sqlite_v4
    legal_history_combinations:
      fresh: [calendar_core_fresh_sqlite_v4]
      json_v1: [calendar_core_json_v1_compat_to_sqlite_v4]
      json_v2:
        - calendar_core_json_v2_to_v3_anniversary_reminder_r1
        - calendar_core_json_v3_to_sqlite_v4
      json_v3: [calendar_core_json_v3_to_sqlite_v4]
    history_invariant: >-
      Schema creation never writes migration history. The importer records only
      the source path actually observed at this v4 initialization, rejects every
      other combination, and repairs only the exact historical v1-plus-spurious-
      v3 pair emitted by the pre-cutover-fix implementation.
    json_v1: >-
      Recover the two frozen v1 journals first, strictly decode Event, Reminder,
      and Notification roots, and import them into isolated compatibility
      tables without UUID or v3 lifecycle reinterpretation. Modern tables start
      empty, matching the previous v1-to-v2 product boundary while preserving
      every v1 record for the legacy APIs.
    json_v2: >-
      Complete or resume the accepted recoverable v2-to-v3 migration first,
      then execute the v3-to-SQLite import.
    json_v3: >-
      Strictly validate all ten entity Stores and Category, import every record
      in source order inside one SQLite transaction, validate metadata and
      quick_check, flush and close the candidate, sync the database file, and
      atomically rename it into place. Publication uses write-through rename on
      Windows and a parent-directory fsync on POSIX systems.
    idempotency: >-
      If calendar_core.sqlite3 exists, JSON is never consulted as live data.
      SQLite metadata, schema version, generations, row identities, strict
      codecs, aggregate invariants, and quick_check must all validate before any
      service is published.
    cutover_state_machine:
      journal_version: 1
      states: [prepared, guards_installed]
      prepared: >-
        The closed and validated .migrating database has been fsynced. The
        cutover journal then records the actual source kind and the exact root or
        absence of every known JSON writer file and is itself atomically written
        and fsynced.
      guard_installation: >-
        Under the Calendar Core directory lock, each current JSON root must still
        equal either its captured source image or its deterministic v4 guarded
        image. Every existing known v1/v2/v3 data or journal writer root is
        atomically replaced with a storage_version 4 guard. Missing
        storage_migrations plus the v1 Event, Reminder, and Notification roots
        are created as global/runtime-entry guards. A fresh v4 initialization
        also creates all ten empty modern entity guards to preserve the former
        empty-bootstrap snapshot behavior; other absent entity or transaction
        files stay absent. Any third value blocks publication as a possible
        concurrent legacy write.
      guards_installed: >-
        The state is written and fsynced only after all writer roots have been
        verified as v4. Only this state permits the atomic database publication.
      recovery: >-
        With no database, a valid journal resumes guard installation and
        candidate publication. With a database, SQLite and every guard are
        revalidated before journal cleanup and service publication. A missing or
        invalid candidate/journal fails closed without selecting JSON or SQLite
        by guesswork.
    failure_recovery: >-
      A stale .migrating database without a cutover journal is removed by exact
      path and rebuilt from JSON. Before the journal is durable JSON remains the
      only authority. After the journal is durable recovery proceeds through the
      declared state machine; SQLite cannot be published until every JSON writer
      is blocked. Failure never deletes source records. For databases produced by
      the vulnerable pre-fix implementation, any still-writable v1/v3 root must
      exactly equal the corresponding SQLite Store before it can be guarded;
      divergence fails with STORAGE_DATA_CORRUPTED instead of hiding data.
  downgrade_guard: >-
    Before SQLite publication, all existing JSON data and transaction/migration
    journal roots keep their complete content but declare storage_version 4.
    Missing storage_migrations.json and the legacy Event, Reminder, and
    Notification roots are created as deterministic empty v4 guards; other
    absent entity and transaction files remain absent for migrated sources. A
    fresh database creates all ten empty modern entity guards, preserving the
    established empty-bootstrap diagnostic snapshots. Together these mandatory
    runtime-entry guards prevent every supported pre-v4 runtime from publishing
    a writer while preserving normal committed-journal cleanup semantics.
  transaction_invariants:
    - every modern and legacy write uses the same process-owned database connection
    - nested Repository calls participate in the outer SQLite transaction
    - callback failure rolls back entity rows and store_generations together
    - a successful commit is acknowledged only after SQLite COMMIT succeeds
    - WAL and SHM files are runtime artifacts and are never independent backup inputs
  test_requirements:
    - exact ten-Store and Category JSON v3 equivalence after migration
    - JSON v1 compatibility import, journal recovery, Unicode, tombstone, and restart
    - empty, populated, idempotent reopen, and retained-snapshot mutation
    - all-Store rollback and successful retry
    - primary, business-unique, scheduling-index, metadata, and schema-version checks
    - valid-JSON identity corruption, unknown version, and quick_check rejection
    - mixed JSON v1 and modern Store or journal rejection without publication or source rewrite
    - missing required table or index rejection during every open
    - same-name but wrong definition rejection for every required table and index
    - exact fresh, v1, v2-to-v3-to-v4, and v3-to-v4 migration history combinations
    - real child-process termination after candidate fsync, journal prepare, every JSON guard, guard-state fsync, database publication, and journal cleanup
    - stale JSON writer rejection immediately after database publication

legacy_v1_no_preservation_policy_before_v4:
  role: historical_policy_superseded_by_calendar_core_v4_compatibility_import
  steps:
    - validate that the source is the confirmed v1 Calendar Core directory
    - remove the confirmed v1 directory after validation; no archive is kept
    - create and initialize an empty v2 directory
    - stop initialization if validation or v2 initialization fails
    - never remove an unconfirmed, corrupt, mixed-version, or v2 directory

logical_stores_role: legacy_v2_migration_source_only
logical_stores:
  events: events.json
  recurrence_versions: recurrence_versions.json
  event_occurrence_states: event_occurrence_states.json
  reminders: reminders.json
  notifications: notifications.json
  reminder_recovery_batches: reminder_recovery_batches.json
  workflow_transactions: workflow_transactions.json
  anniversaries: anniversaries.json
  anniversary_recurrences: anniversary_recurrences.json
  anniversary_workflow_transactions: anniversary_workflow_transactions.json
  categories: categories.json

logical_store_implementation:
  categories:
    implementation_status: integrated
    release_status: active
    activation_evidence: >-
      Event detail aggregation, Kotlin validation, durable post-replace
      recovery, cross-layer normalization and sort conformance, production
      Flutter composition, isolated max-sort JNI verification, and physical
      device Flutter-to-Storage restart smoke passed together on 2026-08-14.

root_envelopes_role: legacy_v2_migration_source_only
root_envelopes:
  events: {version_field: storage_version, version: 2, collection_field: events}
  recurrence_versions: {version_field: storage_version, version: 2, collection_field: recurrence_versions}
  event_occurrence_states: {version_field: storage_version, version: 2, collection_field: event_occurrence_states}
  reminders: {version_field: storage_version, version: 2, collection_field: reminders}
  notifications: {version_field: storage_version, version: 2, collection_field: notifications}
  reminder_recovery_batches: {version_field: storage_version, version: 2, collection_field: reminder_recovery_batches}
  workflow_transactions: {version_field: storage_version, version: 2, collection_field: transactions}
  anniversaries: {version_field: storage_version, version: 2, collection_field: anniversaries}
  anniversary_recurrences: {version_field: storage_version, version: 2, collection_field: anniversary_recurrences}
  anniversary_workflow_transactions: {version_field: storage_version, version: 2, collection_field: transactions}
  categories: {version_field: storage_version, version: 2, collection_field: categories}

file_invariants_role: legacy_v2_migration_source_only
file_invariants:
  - every store root declares storage_version equal to 2
  - every write validates the complete new snapshot before atomic replacement
  - unknown storage_version values fail initialization
  - no repository may create a v1-shaped file inside the v2 directory
  - an existing valid v2 directory may add missing Anniversary stores only as empty v2 roots; existing files are never reset or rewritten by this additive initialization
  - once Category Storage is activated, an absent categories store may be initialized only as the exact empty v2 root; an existing categories file is always validated and is never reset or rewritten by bootstrap

required_uniques:
  events:
    - [id]
  recurrence_versions:
    - [recurrence_id, revision]
  event_occurrence_states:
    - [event_id, recurrence_revision, occurrence_key]
  reminders:
    - [reminder_id]
  reminder_recovery_batches:
    - [recovery_batch_id]
    - [recovery_request_id]
  notification_attempts:
    - [notification_id]
    - [delivery_attempt_id]
  workflow_transactions:
    - [transaction_id]
  anniversaries:
    - [id]
  anniversary_recurrences:
    - [recurrence_id]
  anniversary_workflow_transactions:
    - [transaction_id]
  categories:
    - [id]

conditional_uniques:
  recurring_reminder_identity:
    fields: [target_id, recurrence_revision, occurrence_key, advance_minutes, canonical_methods]
    where: recurrence_revision != null
  notification_prepared_by_delivery:
    fields: [delivery_id]
    where: status == prepared
  notification_sent_by_delivery:
    fields: [delivery_id]
    where: status == sent
  single_in_progress_recovery_batch:
    fields: [status]
    where: status == in_progress

lifecycle_invariants:
  ring_reminder:
    - an ordinary Reminder persists exactly one method, popup or ring
    - a ring Reminder targets an active non-all-day non-recurring Event and has no occurrence identity
    - recurring Reminders remain exactly popup; wechat and multi-method arrays are never successful stored values
  ring_notification:
    - a ring Notification is kind reminder, targets Event, and has no occurrence_key
    - ring sent means Kotlin showed the foreground control notification and actually started sound or vibration
    - recovery summary Notifications remain popup
  ring_recovery:
    - the inclusive grace boundary is derived from persisted started_at minus five minutes and is never recomputed by Kotlin
    - in-window ring Reminders strictly earlier than that boundary are assigned to summary before the 20-detail selection
    - window_overflow_count retains its v2 field shape and equals summary_reminder_ids length, including both late ring and capacity-overflow members
  reminder_expiration:
    - only recovery_batch_reminders_and_summary may transition an open Reminder to expired
    - expired requires is_enabled false, scheduled_at null, expiration_reason recovery_window_elapsed, and expired_at UTC
    - a recurring expired Reminder is committed with at most one open future successor for the same template
  prepared_attempt_resolution:
    - a prepared Notification payload is immutable after it is returned to Kotlin
    - recovery_batch_id and resolved_by_recovery_batch_id are mutually exclusive
    - adopted attempts remain prepared and reference the batch only through resolved_by_recovery_batch_id
    - abandoned attempts require resolved_by_recovery_batch_id, abandon_reason, and finalized_at; stale finalize is rejected
  scheduler_acknowledgement:
    - mark_scheduled compares expected_remind_at with the persisted remind_at inside the Reminder write transaction
    - a mismatch returns REMINDER_SCHEDULE_CONFLICT and writes no Reminder fields
  v1_discard_recognition:
    - the v1 Reminder status and cancellation-reason allow-lists are frozen independently from v2 domain validators
    - v2-only expired and occurrence_reopened values never qualify a directory for automatic v1 removal

category_store:
  runtime_role: legacy_v2_migration_source_only
  implementation_status: integrated
  release_status: active
  file: categories.json
  schema: storage/category_store.schema.json
  strategy:
    format: strict JSON full snapshot
    rationale:
      - Category is low-cardinality configuration data and the current public operations are list and create
      - a complete snapshot is cheap to validate and reuses the existing directory lock, atomic file replacement, and corruption policy
      - the Repository boundary allowed SQLite v4 to replace this writer without leaking into Domain or transport DTOs
    reconsider_when:
      - account-partitioned sync or independently versioned remote merges are introduced
      - write frequency or record volume makes full-snapshot replacement measurably unsuitable
      - a required Category workflow crosses logical stores and needs a broader transaction model
  root:
    exact_fields: [storage_version, categories]
    storage_version: 2
    collection_field: categories
    empty_snapshot: {storage_version: 2, categories: []}
  record:
    name: CategoryStorageRecord
    exact_fields:
      - id
      - name
      - description
      - color
      - icon
      - sort_order
      - created_at
      - updated_at
      - deleted_at
    nullable_fields: [description, icon, deleted_at]
    transport_projection: category/category_response.schema.json
    invariants:
      - id is a canonical lowercase UUIDv4 generated by the C++ writer
      - name, description, and icon contain canonical trimmed text; blank optional text is persisted as null
      - "color is canonical uppercase #RRGGBB and is never null in the official local store"
      - sort_order is an integer from 0 through 9007199254740991; a null create input is materialized before persistence
      - created_at and updated_at are whole-second UTC instants and updated_at is not earlier than created_at
      - deleted_at is null or a whole-second UTC instant not earlier than created_at
      - a newly created record has deleted_at null and created_at equal to updated_at
      - unknown fields, missing nullable keys, duplicate ids, and invalid records fail the complete store load
  scope:
    storage_partition: current local Calendar Core directory
    persisted_owner_fields: none
    invariants:
      - user_id, owner_name, is_default, and presentation grouping fields are forbidden in CategoryStorageRecord v2
      - adding account ownership or sync partitioning requires an explicit future Contract and migration decision
  uniqueness:
    id: required
    name: not_constrained_in_current_contract
    sort_order: not_constrained_in_current_contract
  ordering:
    snapshot_order: id ascending
    list_projection_order: sort_order ascending, then created_at ascending, then id ascending; the wider response comparator still keeps null last for non-store compatibility readers
    default_create_order: >-
      When the request sort_order is null, the C++ workflow persists zero if no
      active record exists; otherwise it persists the checked maximum active
      sort_order plus one. If that maximum is 9007199254740991, creation returns
      CATEGORY_SORT_ORDER_EXHAUSTED and writes nothing. Explicit duplicate sort
      values remain legal and are resolved by the list tie-breakers.
  numeric_boundary:
    minimum: 0
    maximum: 9007199254740991
    rationale: interoperable JSON safe-integer maximum whose adjacent integers remain distinct under IEEE-754 binary64
    error_semantics:
      request_above_maximum: CONTRACT_VALIDATION_FAILED
      persisted_above_maximum: STORAGE_DATA_CORRUPTED
      automatic_append_at_maximum: CATEGORY_SORT_ORDER_EXHAUSTED with no write
  reference_integrity:
    relationship: weak_by_design
    referencing_fields:
      - Event.category_id
      - Habit.category_id
      - Anniversary.category_id
      - SearchIndex.category_id
    invariants:
      - Category records use UUIDv4 ids, but already released category_id readers continue to accept nullable opaque strings for legacy references
      - a missing or soft-deleted Category never makes a referencing business record unreadable
      - bootstrap, list, create, and future soft delete never cascade, clear, normalize, or rewrite category_id in another store
      - aggregate projections may return a null Category while preserving the original category_id
  initialization:
    new_v2_directory: create the exact empty root
    existing_v2_without_categories: create only the exact empty root after the existing directory has passed validation
    existing_valid_categories: preserve and load without rewriting
    existing_invalid_categories: fail initialization with STORAGE_DATA_CORRUPTED and preserve the original file
    historical_source: none
    fake_repository_import: forbidden
    default_category_seed: forbidden_until_product_semantics_are_frozen
  write_protocol:
    lock_scope: existing Calendar Core directory-wide recursive mutex and runtime single-writer lease
    steps:
      - load and validate the complete current categories snapshot
      - apply one Category domain command in memory
      - validate uniqueness, canonical fields, lifecycle invariants, and the complete new snapshot
      - serialize records in snapshot_order
      - write a same-directory temporary file, flush and fsync it, atomically replace categories.json, then sync the directory
    commit_point: successful directory sync after the atomic replacement
    failure_guarantee: any validation or I/O failure leaves the previous categories.json snapshot authoritative
  transaction_policy:
    journal_required: false
    reason: >-
      category.create and future same-file reorder or soft-delete operations mutate
      only categories.json, so one validated atomic snapshot replacement is the
      transaction boundary.
    future_gate: >-
      Any workflow that must atomically mutate Category plus another logical
      store must define a dedicated recoverable journal contract before it is
      exposed; it must not silently widen either existing journal's exact store set.
  compatibility:
    storage_format_version: 2
    rationale: >-
      categories.json is an independent additive file; it does not alter any
      integrated v2 root envelope, record codec, or journal. Existing v2 runtimes
      ignore the unknown file and must leave it untouched.
    migration_from_v1: none
    migration_from_flutter_fake: none

workflow_journal:
  states: [prepared, committed]
  recovery: replay_prepared_idempotently_then_commit
  record_fields:
    transaction_id: required_uuid_v4
    operation: required_stable_string
    intent_version: required_positive_integer
    intent: required_strict_object_for_operation_and_intent_version
    affected_stores: required_unique_logical_store_names
    state: required_prepared_or_committed
    prepared_at: required_utc_instant
    committed_at: nullable_utc_instant
  operations:
    - event_recurrence_and_first_reminder_create_or_update
    - occurrence_state_and_reminder_transition
    - delivery_finalize_notification_reminder_and_successor
    - recovery_batch_reminders_and_summary
    - series_complete_cancel_delete_or_reopen
  intent_codecs:
    version_1:
      applies_to: all_declared_operations
      exact_fields: [after_stores]
      after_stores: >-
        Complete, already validated v2 root snapshots keyed by the six logical
        data-store names. File names are storage-adapter details and are forbidden
        as keys in affected_stores or after_stores.
  invariants:
    - each operation plus intent_version selects a strict storage-internal codec; unknown fields, operations, or versions fail recovery
    - intent_version 1 uses the same exact full-after-state codec for every declared operation; operation remains a required audited discriminator
    - affected_stores contains exactly the six logical data-store names represented by intent.after_stores
    - the complete after-state, transaction_id, operation, and prepared_at contain everything needed for deterministic idempotent replay
    - write and fsync prepared intent before applying repository changes
    - every repository mutation is idempotent under transaction_id
    - write and fsync commit only after all repository changes succeed
    - replay all prepared uncommitted transactions during runtime.initialize
    - committed records may be compacted only after all affected store snapshots are durable
    - corrupted or unverifiable journal data fails initialization without resetting storage

anniversary_workflow_journal:
  isolation: >-
    This narrow journal is independent from workflow_transactions.json and does
    not change the existing Event/Reminder journal's exact six-store invariant.
  states: [prepared, committed]
  recovery: replay_prepared_idempotently_then_commit
  record_fields:
    transaction_id: required_uuid_v4
    operation: required_stable_string
    intent_version: required_positive_integer
    intent: required_strict_object_for_operation_and_intent_version
    affected_stores: required_unique_logical_store_names
    state: required_prepared_or_committed
    prepared_at: required_utc_instant
    committed_at: nullable_utc_instant
  operations:
    - anniversary_create
    - anniversary_update
    - anniversary_delete
  intent_codecs:
    version_1:
      applies_to: all_declared_operations
      exact_fields: [after_stores]
      after_stores: >-
        Complete, already validated v2 root snapshots keyed by anniversaries and
        anniversary_recurrences. File names are storage-adapter details and are
        forbidden as keys in affected_stores or after_stores.
  invariants:
    - affected_stores contains exactly anniversaries and anniversary_recurrences
    - write and fsync prepared intent before applying either data-store snapshot
    - the complete after-state is sufficient for deterministic idempotent replay
    - write and fsync commit only after both data-store snapshots are durable
    - replay a prepared transaction during runtime.initialize before serving calls
    - corrupted or unverifiable journal data fails initialization without resetting storage

calendar_core_v3:
  format_name: excellent_calendar_core_json
  storage_format_version: 3
  implementation_status: integrated
  release_status: blocked
  superseded_by: calendar_core_v4
  runtime_role: migration_source_and_strict_row_payload_codec
  activation_evidence: >-
    The v2-to-v3 migration, shared coordinator, Anniversary Reminder/Occurrence
    readers and writers, Kotlin/JNI/Dart mappings, build-after-test, Flutter
    cross-layer smoke, and physical-device process-death Alarm, Notification,
    tap, and annual-successor verification passed together on 2026-08-24.
  directory: files/local_storage/calendar_core_storage_json
  downgrade_policy: >-
    A v2 runtime must reject and preserve a v3 directory. Downgrade is unsafe;
    it must never clear, partially read, or recreate the directory as v2.

  logical_stores:
    events: events.json
    recurrence_versions: recurrence_versions.json
    event_occurrence_states: event_occurrence_states.json
    reminders: reminders.json
    notifications: notifications.json
    reminder_recovery_batches: reminder_recovery_batches.json
    anniversaries: anniversaries.json
    anniversary_recurrences: anniversary_recurrences.json
    anniversary_reminder_templates: anniversary_reminder_templates.json
    categories: categories.json
    calendar_workflow_transactions: calendar_workflow_transactions.json
    storage_migrations: storage_migrations.json
  legacy_v2_journals:
    - workflow_transactions.json
    - anniversary_workflow_transactions.json
  legacy_journal_policy: >-
    v3 bootstrap first recovers every prepared v2 journal using the frozen v2
    codec. Migration may start only after both journals contain no unresolved
    prepared transaction. They are migration inputs and are never v3 writers.

  root_envelopes:
    events: {version_field: storage_version, version: 3, collection_field: events}
    recurrence_versions: {version_field: storage_version, version: 3, collection_field: recurrence_versions}
    event_occurrence_states: {version_field: storage_version, version: 3, collection_field: event_occurrence_states}
    reminders: {version_field: storage_version, version: 3, collection_field: reminders}
    notifications: {version_field: storage_version, version: 3, collection_field: notifications}
    reminder_recovery_batches: {version_field: storage_version, version: 3, collection_field: reminder_recovery_batches}
    anniversaries: {version_field: storage_version, version: 3, collection_field: anniversaries}
    anniversary_recurrences: {version_field: storage_version, version: 3, collection_field: anniversary_recurrences}
    anniversary_reminder_templates: {version_field: storage_version, version: 3, collection_field: anniversary_reminder_templates}
    categories: {version_field: storage_version, version: 3, collection_field: categories}
    calendar_workflow_transactions: {version_field: storage_version, version: 3, collection_field: transactions}
    storage_migrations: {version_field: storage_version, version: 3, collection_field: migrations}

  record_changes:
    anniversaries:
      added_required_fields:
        reminders_enabled:
          type: boolean
          v2_default: false
      invariants:
        - Existing v2 records migrate with reminders_enabled false.
        - Soft-deleted and active records preserve every existing field verbatim.
        - Reminder templates are not embedded; the dedicated template store is the configuration truth source.
    anniversary_reminder_templates:
      record: AnniversaryReminderTemplateStorageRecord
      exact_fields:
        - template_key
        - anniversary_id
        - advance_days
        - local_time
        - timezone_mode
        - method
        - is_enabled
        - created_at
        - updated_at
        - deleted_at
      nullable_fields: [deleted_at]
      uniques:
        - [template_key]
        - [anniversary_id, advance_days, local_time, timezone_mode, method]
      invariants:
        - advance_days is an integer from 0 through 365
        - local_time is exact zero-padded HH:mm
        - timezone_mode is follow_device and method is popup
        - each Anniversary has at most five non-deleted templates
        - template_key matches contracts/identity.yaml and is never accepted from an unverified writer
        - a missing or soft-deleted Anniversary makes an active template corrupted storage
      v2_initial_root: {storage_version: 3, anniversary_reminder_templates: []}
    reminders:
      added_required_nullable_fields:
        - template_key
        - occurrence_date
        - advance_days
        - local_time
        - timezone_mode
        - fulfillment_delivery_id
      migration_defaults_for_v2_records:
        template_key: null
        occurrence_date: null
        advance_days: null
        local_time: null
        timezone_mode: null
        fulfillment_delivery_id: null
      target_specific_invariant: >-
        Event and Habit records retain every v2 value and require all new fields
        null. Anniversary v3 records require the strict branch declared by
        reminder/reminder_response.schema.json. No v2 Anniversary Reminder can
        exist because the v2 domain rejected it.
    notifications:
      added_required_fields:
        covered_reminder_ids:
          type: array
          v2_default: []
      invariants:
        - Every v2 attempt preserves all existing identity, status, timestamp, failure, soft-delete, and audit values.
        - Existing reminder and recovery_summary records migrate with covered_reminder_ids empty.
        - anniversary_catch_up requires one through five unique sorted members and a matching deterministic delivery_id.
    reminder_recovery_batches:
      added_required_fields:
        anniversary_catch_up_groups:
          type: array
          v2_default: []
      invariants:
        - Existing detail_reminder_ids, summary_reminder_ids, counts, summary_delivery_id, status, and completed_at remain unchanged.
        - Anniversary group members are disjoint from ordinary detail and summary members.
        - Ring five-minute and global 20-detail behavior is identical to v2.
    unchanged_records:
      - events
      - recurrence_versions
      - event_occurrence_states
      - anniversary_recurrences
      - categories

  required_uniques:
    anniversary_reminder_templates:
      - [template_key]
      - [anniversary_id, advance_days, local_time, timezone_mode, method]
    anniversary_reminders:
      - [reminder_id]
      - [target_id, occurrence_key, template_key]
    anniversary_catch_up_deliveries:
      - [delivery_id]
    anniversary_catch_up_membership:
      - [recovery_batch_id, reminder_id]

  shared_workflow_coordinator:
    file: calendar_workflow_transactions.json
    lock_scope: Calendar Core directory-wide recursive mutex and process single-writer lease
    purpose: >-
      Every v3 workflow that writes reminders.json uses this one storage-level
      coordinator, including existing Event/Occurrence/Recovery delivery flows
      and new Anniversary create/update/delete/toggle/recovery/finalize flows.
      This prevents a prepared journal from replaying a stale reminders after-image.
    states: [prepared, committed]
    record_fields:
      transaction_id: required_uuid_v4
      operation: required_stable_string
      intent_version: required_positive_integer
      affected_stores: required_unique_v3_logical_store_names
      before_generation: required_non_negative_integer_by_store
      after_stores: required_complete_validated_v3_roots_for_affected_stores
      state: required_prepared_or_committed
      prepared_at: required_utc_instant
      committed_at: nullable_utc_instant
    operations:
      - event_recurrence_and_first_reminder_create_or_update
      - occurrence_state_and_reminder_transition
      - delivery_finalize_notification_reminder_and_successor
      - recovery_batch_reminders_and_summary
      - series_complete_cancel_delete_or_reopen
      - anniversary_create_with_reminders
      - anniversary_update_with_reminders
      - anniversary_delete_with_reminders
      - anniversary_toggle_reminders
      - anniversary_recovery_plan
      - anniversary_delivery_finalize
      - anniversary_timezone_recalculate
    invariants:
      - Application receives narrow intent-level Repository ports, never a mutable CalendarCoreState or journal record.
      - affected_stores exactly equals the keys of after_stores and every after root is fully validated before prepare.
      - before_generation is compared under the directory lock; stale after-images fail with CALENDAR_WORKFLOW_COMMIT_FAILED.
      - prepared intent is flushed before the first Store replacement; committed state is flushed only after every Store and directory entry are durable.
      - replay uses the persisted after_stores and transaction_id and never generates new identity or timestamps.
      - runtime initializes no Query, Scheduler, or JNI service until all prepared commits are recovered.
      - corrupted or unverifiable journal data returns CALENDAR_WORKFLOW_RECOVERY_FAILED and preserves every file.

  migration_v2_to_v3:
    migration_id: calendar_core_json_v2_to_v3_anniversary_reminder_r1
    source_version: 2
    target_version: 3
    idempotency: >-
      A complete v3 directory returns already_migrated without rewriting. A
      prepared migration resumes from the persisted validated after-images. A
      mixed directory without a valid migration record is corruption and is
      preserved unchanged.
    ordered_steps:
      - acquire the directory lock and prevent runtime services from starting
      - recognize and strictly validate one complete v2 directory; v1 and mixed versions are not migration inputs
      - recover workflow_transactions.json and anniversary_workflow_transactions.json with their frozen v2 codecs
      - reload and validate every v2 Store after journal recovery
      - build all v3 roots in memory, preserving unknown data only where the v2 codec explicitly designates it preservable
      - set anniversaries.reminders_enabled false and create an empty anniversary_reminder_templates root
      - add null Anniversary-specific fields to every v2 Reminder, add empty covered_reminder_ids to every Notification, and add empty anniversary_catch_up_groups to every RecoveryBatch
      - preserve Event, Ring, recurrence, occurrence-state, Category, tombstone, timestamp, failure, cancellation, notification, and Recovery audit values field-for-field
      - validate cross-store references, uniques, target-specific branches, identity fields, and every complete v3 root
      - persist and fsync a prepared storage_migrations record containing hashes and complete after-images
      - atomically replace each declared v3 Store under the directory lock, then fsync the directory
      - write and fsync committed migration state; only then allow v3 workflow recovery and runtime services
    failure_recovery:
      before_prepare: leave the complete v2 directory authoritative
      after_prepare: resume forward from the validated migration after-images
      after_any_store_replace: resume forward; never attempt an inferred reverse migration
      corrupted_migration_record: fail initialization, preserve all files, and return CALENDAR_WORKFLOW_RECOVERY_FAILED
    rollback: >-
      There is no automatic v3-to-v2 downgrade. A pre-migration external backup
      may be restored only by an explicit user-authorized recovery flow; normal
      App rollback must refuse the v3 directory.
    test_requirements:
      - empty and populated v2 directories
      - Event popup, ordinary Ring, recurring Reminder, prepared/finalized Notification, RecoveryBatch, Anniversary active and tombstone records
      - rerun after complete migration
      - failure after migration prepare and after every Store replacement
      - corrupted v2 record, corrupted migration record, unknown version, and mixed-version directory rejection
      - exact preservation of soft deletion and delivery audit fields
