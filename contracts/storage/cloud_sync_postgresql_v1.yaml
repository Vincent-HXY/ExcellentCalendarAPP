new_functions:
  guard_device_registration: "CREATE FUNCTION guard_device_registration() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='UPDATE' AND\
    \ OLD.revoked_at IS NOT NULL AND NEW.revoked_at IS NULL THEN\n    RAISE EXCEPTION 'DEVICE_REVOKED' USING ERRCODE='23514';\n  END IF;\n  IF\
    \ TG_OP='INSERT' AND NEW.revoked_at IS NULL THEN\n    PERFORM id FROM user_accounts WHERE id=NEW.account_id FOR UPDATE;\n    IF (SELECT count(*)\
    \ FROM user_devices WHERE account_id=NEW.account_id AND revoked_at IS NULL)>=10 THEN\n      RAISE EXCEPTION 'DEVICE_LIMIT_REACHED' USING ERRCODE='23514';\n\
    \    END IF;\n  END IF;\n  RETURN NEW;\nEND $$"
  guard_immutable_event_recurrence: CREATE FUNCTION guard_immutable_event_recurrence() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN IF ROW(OLD."recurrence_id",OLD."revision",OLD."frequency",OLD."interval",OLD."start_at",OLD."start_date",OLD."timezone",OLD."day_of_month",OLD."days_of_week",OLD."month_of_year",OLD."end_at",OLD."count",OLD."created_at")
    IS DISTINCT FROM ROW(NEW."recurrence_id",NEW."revision",NEW."frequency",NEW."interval",NEW."start_at",NEW."start_date",NEW."timezone",NEW."day_of_month",NEW."days_of_week",NEW."month_of_year",NEW."end_at",NEW."count",NEW."created_at")
    THEN RAISE EXCEPTION 'IMMUTABLE_RECURRENCE_REVISION' USING ERRCODE='23514'; END IF; RETURN NEW; END $$
  guard_immutable_anniversary_recurrence: CREATE FUNCTION guard_immutable_anniversary_recurrence() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN
    IF ROW(OLD."recurrence_id",OLD."frequency",OLD."interval",OLD."created_at") IS DISTINCT FROM ROW(NEW."recurrence_id",NEW."frequency",NEW."interval",NEW."created_at")
    THEN RAISE EXCEPTION 'IMMUTABLE_RECURRENCE_REVISION' USING ERRCODE='23514'; END IF; RETURN NEW; END $$
  guard_immutable_habit_recurrence: CREATE FUNCTION guard_immutable_habit_recurrence() RETURNS trigger LANGUAGE plpgsql AS $$ BEGIN IF ROW(OLD."id",OLD."frequency",OLD."interval",OLD."timezone_mode",OLD."created_at")
    IS DISTINCT FROM ROW(NEW."id",NEW."frequency",NEW."interval",NEW."timezone_mode",NEW."created_at") THEN RAISE EXCEPTION 'IMMUTABLE_RECURRENCE_REVISION'
    USING ERRCODE='23514'; END IF; RETURN NEW; END $$
  guard_habit_operation: "CREATE FUNCTION guard_habit_operation() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='DELETE' THEN\n  \
    \  IF EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) THEN\n      RAISE EXCEPTION 'operation identity retained until account deletion'\
    \ USING ERRCODE='23514';\n    END IF;\n    RETURN OLD;\n  END IF;\n  IF (NEW.account_id,NEW.operation_id,NEW.habit_id,NEW.check_date,NEW.entity_id,NEW.operation_type,NEW.amount_hundredths,NEW.operation_hash)\n\
    \      IS DISTINCT FROM (OLD.account_id,OLD.operation_id,OLD.habit_id,OLD.check_date,OLD.entity_id,OLD.operation_type,OLD.amount_hundredths,OLD.operation_hash)\n\
    \      OR (OLD.applied AND (NEW.applied,NEW.effect_group_id,NEW.effect_group_last_server_sequence,NEW.effect_entity_version) IS DISTINCT FROM\n\
    \                         (OLD.applied,OLD.effect_group_id,OLD.effect_group_last_server_sequence,OLD.effect_entity_version)) THEN\n    RAISE\
    \ EXCEPTION 'operation identity or applied effect immutable' USING ERRCODE='23514';\n  END IF;\n  RETURN NEW;\nEND $$"
  guard_habit_barrier: "CREATE FUNCTION guard_habit_barrier() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='DELETE' THEN\n    IF\
    \ EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) THEN\n      RAISE EXCEPTION 'completion barrier retained until account deletion'\
    \ USING ERRCODE='23514';\n    END IF;\n    RETURN OLD;\n  END IF;\n  IF (NEW.account_id,NEW.entity_id) IS DISTINCT FROM (OLD.account_id,OLD.entity_id)\
    \ OR NEW.completion_version<OLD.completion_version THEN\n    RAISE EXCEPTION 'completion barrier cannot regress' USING ERRCODE='23514';\n\
    \  END IF;\n  RETURN NEW;\nEND $$"
  guard_import_publication_history: "CREATE FUNCTION guard_import_publication_history() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='DELETE'\
    \ THEN\n    IF EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) THEN\n      RAISE EXCEPTION 'import lineage retained until account\
    \ deletion' USING ERRCODE='23514';\n    END IF;\n    RETURN OLD;\n  END IF;\n  IF (OLD.ever_published AND NOT NEW.ever_published) OR\n   \
    \  ROW(NEW.account_id,NEW.lineage_id,NEW.source_workspace_id,NEW.source_epoch) IS DISTINCT FROM\n     ROW(OLD.account_id,OLD.lineage_id,OLD.source_workspace_id,OLD.source_epoch)\
    \ THEN\n    RAISE EXCEPTION 'immutable import lineage publication history' USING ERRCODE='23514';\n  END IF;\n  RETURN NEW;\nEND $$"
  guard_import_mapping: "CREATE FUNCTION guard_import_mapping() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='DELETE' THEN\n    IF\
    \ EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) THEN\n      RAISE EXCEPTION 'import assignment retained until account deletion'\
    \ USING ERRCODE='23514';\n    END IF;\n    RETURN OLD;\n  END IF;\n  IF TG_TABLE_NAME='sync_import_recurrence_families' THEN\n    IF NEW IS\
    \ DISTINCT FROM OLD THEN\n      RAISE EXCEPTION 'immutable recurrence family assignment' USING ERRCODE='23514';\n    END IF;\n  ELSE\n   \
    \ IF ROW(NEW.account_id,NEW.lineage_id,NEW.source_workspace_id,NEW.source_epoch,NEW.target_type,NEW.source_id,NEW.target_id)\n       IS DISTINCT\
    \ FROM ROW(OLD.account_id,OLD.lineage_id,OLD.source_workspace_id,OLD.source_epoch,OLD.target_type,OLD.source_id,OLD.target_id)\n       OR\
    \ NEW.provenance_version<OLD.provenance_version\n       OR (OLD.first_published_batch_id IS NOT NULL AND NEW.first_published_batch_id IS DISTINCT\
    \ FROM OLD.first_published_batch_id)\n       OR (NEW.last_published_batch_id IS DISTINCT FROM OLD.last_published_batch_id AND NEW.provenance_version<=OLD.provenance_version)\
    \ THEN\n      RAISE EXCEPTION 'immutable import assignment or publication regression' USING ERRCODE='23514';\n    END IF;\n  END IF;\n  RETURN\
    \ NEW;\nEND $$"
  guard_cursor_key_usage: "CREATE FUNCTION guard_cursor_key_usage() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='UPDATE' THEN\n\
    \    IF ROW(NEW.account_id,NEW.key_id,NEW.account_generation) IS DISTINCT FROM ROW(OLD.account_id,OLD.key_id,OLD.account_generation)\n   \
    \    OR NEW.maximum_snapshot_upper_bound<OLD.maximum_snapshot_upper_bound\n       OR (OLD.bootstrap_valid_through IS NOT NULL AND (NEW.bootstrap_valid_through\
    \ IS NULL OR NEW.bootstrap_valid_through<OLD.bootstrap_valid_through)) THEN\n      RAISE EXCEPTION 'cursor key usage regression' USING ERRCODE='23514';\n\
    \    END IF;\n    RETURN NEW;\n  END IF;\n  IF EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) AND\n     ((OLD.bootstrap_valid_through\
    \ IS NOT NULL AND OLD.bootstrap_valid_through>transaction_timestamp()) OR\n      NOT EXISTS(SELECT 1 FROM sync_account_sequences s WHERE s.account_id=OLD.account_id\
    \ AND\n        (s.account_generation>OLD.account_generation OR (s.account_generation=OLD.account_generation AND s.retention_floor>OLD.maximum_snapshot_upper_bound))))\
    \ THEN\n    RAISE EXCEPTION 'cursor verification key still required' USING ERRCODE='23514';\n  END IF;\n  RETURN OLD;\nEND $$"
  guard_bootstrap_key_usage: "CREATE FUNCTION guard_bootstrap_key_usage() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='UPDATE' AND\n\
    \     (((to_jsonb(NEW)-'superseded_at') IS DISTINCT FROM (to_jsonb(OLD)-'superseded_at')) OR\n      (OLD.superseded_at IS NOT NULL AND NEW.superseded_at\
    \ IS DISTINCT FROM OLD.superseded_at)) THEN\n    RAISE EXCEPTION 'bootstrap session identity immutable' USING ERRCODE='23514';\n  END IF;\n\
    \  IF NOT EXISTS(SELECT 1 FROM sync_cursor_key_usage u WHERE u.account_id=NEW.account_id AND u.key_id=NEW.cursor_key_id\n      AND u.account_generation=NEW.account_generation\
    \ AND u.maximum_snapshot_upper_bound>=NEW.upper_bound\n      AND u.bootstrap_valid_through>=NEW.expires_at) THEN\n    RAISE EXCEPTION 'bootstrap\
    \ signing range not recorded' USING ERRCODE='23514';\n  END IF;\n  RETURN NEW;\nEND $$"
  guard_bootstrap_item: "CREATE FUNCTION guard_bootstrap_item() RETURNS trigger LANGUAGE plpgsql AS $$\nBEGIN\n  IF TG_OP='UPDATE' THEN\n    RAISE\
    \ EXCEPTION 'materialized bootstrap item immutable' USING ERRCODE='23514';\n  ELSIF TG_OP='INSERT' THEN\n    IF NOT EXISTS(SELECT 1 FROM sync_bootstrap_sessions\
    \ s WHERE s.account_id=NEW.account_id AND s.bootstrap_id=NEW.bootstrap_id\n        AND NEW.ordinal<s.total_item_count AND s.superseded_at\
    \ IS NULL) THEN\n      RAISE EXCEPTION 'bootstrap item outside frozen snapshot' USING ERRCODE='23514';\n    END IF;\n    RETURN NEW;\n  ELSE\n\
    \    IF EXISTS(SELECT 1 FROM user_accounts WHERE id=OLD.account_id) AND EXISTS(\n        SELECT 1 FROM sync_bootstrap_sessions s WHERE s.account_id=OLD.account_id\
    \ AND s.bootstrap_id=OLD.bootstrap_id\n        AND s.superseded_at IS NULL AND s.expires_at>transaction_timestamp()) THEN\n      RAISE EXCEPTION\
    \ 'active bootstrap item cannot be removed' USING ERRCODE='23514';\n    END IF;\n    RETURN OLD;\n  END IF;\nEND $$"
new_triggers:
  guard_device_registration: CREATE TRIGGER guard_device_registration BEFORE INSERT OR UPDATE ON user_devices FOR EACH ROW EXECUTE FUNCTION guard_device_registration()
  guard_immutable_event_recurrence: CREATE TRIGGER guard_immutable_event_recurrence BEFORE UPDATE ON sync_fact_event_recurrence FOR EACH ROW EXECUTE
