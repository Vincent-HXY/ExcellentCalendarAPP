transaction_rules:
  scope: Principal account required in every query and account_id participates in every PK/FK; do not infer scope from client account id
  sequence: lock account/device allocator rows; checked safe increment with facts/receipts/groups in the same transaction
  habit_operations: sync/sync_habit_operation_protocol.yaml; permanent account-qualified operation digest and successful effect, independent of
    transport receipt TTL; adjudication+barrier+history guard+change+receipt atomic
  import_capacity: lock account allocator; at most 2 unpublished batches, 100000 items and 268435456 bytes per account; per-batch SQL constraints
    additionally apply
  import_publication_history: set sync_import_lineages.ever_published=true in the first publication transaction, including zero-item imports;
    never regress or garbage-collect the lineage until authoritative account deletion; signed range proofs read this value under the lineage lock
  reauth: consume unexpired grant and revoke target device + all bound sessions atomically
  device_limit: lock account then enforce at most 10 active devices; revoked rows never reactivate
  device_reminder_genesis: first registered device receive_reminders=true; later devices read current portable auto_enable_reminders_on_other_devices,
    whose default is false; preference changes never modify existing devices
  strong_graph: deferred account-qualified FKs plus target semantic/ownership checker before commit; Category references are intentionally weak
    and Anniversary opaque bytes are preserved
  immutable_recurrence: INSERT-only revision tuple; a different payload at the same tuple is a graph conflict, never UPDATE
  payload_json: only versioned, hashed, strict Schema-validated mutation/patch/result/snapshot journals; live facts are typed columns/child rows,
    not a generic JSONB entity
  legacy_preferences: locale/settings remain legacy storage only; target writer owns exactly four portable columns; existing rows calibrated and
    legacy values not silently copied into new fields
