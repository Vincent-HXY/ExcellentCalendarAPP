encoding:
  byte_order: big_endian
  claims_bytes: 133
  mac_bytes: 32
  total_bytes: 165
  token_characters: 220
  unknown_length_magic_kind_version_or_noncanonical_base64url: SYNC_CURSOR_INVALID
