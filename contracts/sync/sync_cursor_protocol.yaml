    - {name: key_id, offset: 9, bytes: 16, type: uuid_v4}
    - {name: account_id, offset: 25, bytes: 16, type: canonical_uuid}
    - {name: device_id, offset: 41, bytes: 16, type: uuid_v4}
    - {name: protocol_version, offset: 57, bytes: 4, constant: 1}
