authentication:
  key_bytes: 32
  key_location: Backend_private_secret_store_never_HTTP_Native_logs_or_client_cache
  domain_prefix_utf8: "ExcellentCalendar.SyncCursor.v1\n"
  mac_input: domain_prefix_followed_by_exact_claims_bytes_0_through_132
  comparison: constant_time
  trust_selection: only_preconfigured_key_id_then_verify_mac_before_interpreting_claims
  normal_key_retirement: all_accounts_issued_ranges_strictly_below_current_floor_or_older_generation_and_all_referencing_bootstrap_sessions_expired
  missing_retirement_watermark: retain_verification_key
  durable_usage_model: ../storage/cloud_sync_postgresql_v1.yaml#/new_tables/sync_cursor_key_usage
  cleanup_order: delete_expired_bootstrap_sessions_then_eligible_usage_rows_then_secret_only_after_all_account_usage_rows_are_absent
  emergency_key_compromise: separate_security_event_and_explicit_rebuild_not_normal_rotation
sync:
  bootstrap_id: all_zero_bytes
  sync_transport_generation: 0
  expires_at_epoch_seconds: 0
  position: covered_server_sequence_less_than_or_equal_to_fixed_snapshot_upper_bound
  valid_floor: position_greater_than_or_equal_to_current_retention_floor
  expiry: retention_floor_not_wall_clock
  terminal_position: snapshot_upper_bound
bootstrap:
  bootstrap_id: nonzero_uuid_v4
  position: next_materialized_page_ordinal
  transport_generation: exact_creation_binding
  expires_at_epoch_seconds: creation_server_epoch_seconds_plus_86400
  expiry_boundary: now_greater_than_or_equal_to_expires_at
errors:
  authenticated_wrong_account: SYNC_CURSOR_ACCOUNT_MISMATCH
  authenticated_wrong_device: SYNC_CURSOR_DEVICE_MISMATCH
  sync_generation: SYNC_CURSOR_GENERATION_MISMATCH
  sync_below_floor: SYNC_CURSOR_EXPIRED
  bootstrap_generation: SYNC_BOOTSTRAP_GENERATION_CHANGED
  bootstrap_transport: SYNC_TRANSPORT_GENERATION_MISMATCH
  bootstrap_expired: SYNC_BOOTSTRAP_EXPIRED
