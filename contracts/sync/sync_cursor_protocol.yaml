    - {name: snapshot_upper_bound, offset: 69, bytes: 8, type: safe_unsigned_integer}
    - {name: position, offset: 77, bytes: 8, type: safe_unsigned_integer}
    - {name: bootstrap_id, offset: 85, bytes: 16, type: uuid_v4_or_all_zero_for_sync}
    - {name: sync_transport_generation, offset: 101, bytes: 8, type: safe_unsigned_integer}
    - {name: expires_at_epoch_seconds, offset: 109, bytes: 8, type: safe_unsigned_integer}
    - {name: retention_floor_server_sequence, offset: 117, bytes: 8, type: safe_unsigned_integer}
    - {name: resolved_cleanup_before_epoch_seconds, offset: 125, bytes: 8, type: safe_unsigned_integer}
