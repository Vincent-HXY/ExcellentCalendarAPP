version: 3
implementation_status: planned
release_status: planned
rule_anchor: cloud-sync-02/8
activation: same_apk_only_after_frozen_revision_and_all_consumer_gates
method_registry: native_v3/method_channels.yaml
native_registry: native_v3/native_calls.yaml
backend_registry: backend_sync_v1/backend_api.yaml
default_unknown_capability: deny_notImplemented
visibility:
  flutter_forbidden:
  - raw_cursor
  - client_sequence
  - refresh_token
  - outbox
  - raw_change
  - database_key
  kotlin_forbidden:
  - reconstruct_mutation
  - merge_domain_fields
  - persist_or_advance_sync_cursor
  cpp_forbidden:
  - http
  - select_active_route
schema_wire_shape:
  legacy_public: route identity plus typed payload; v2 payload semantics unchanged
    except declared v3 revisions
  legacy_native: pinned runtime binding plus typed payload; v2 global initialize cannot
    route a v6 workspace
  new: strict schemas named per capability; nested repeated identity must equal binding,
    never caller-controlled account identity
internal_workflows:
  bootstrap:
    http:
    - sync.bootstrap
    native:
    - sync.begin_bootstrap
    - sync.apply_bootstrap_page
    - sync.finalize_bootstrap
    owner: SyncCoordinator
  receipt_ack_flush:
    http:
    - sync.exchange
    native:
    - sync.prepare_upload_batch
    - sync.acknowledge_upload
    owner: SyncCoordinator
    apply_download: false
  guest_source_cleanup:
    http:
    - sync.import.cleanup_confirm
    native:
    - workspace.import_cleanup_confirm
    - workspace.import_finalize_source_lease
    owner: WorkspaceImportCoordinator
  maintenance:
    http: []
    native:
    - sync.run_local_maintenance
    owner: WorkspaceMaintenanceWorker
old_reserved_routes:
  sync.apply: always notImplemented; no Native implementation
  notification.list: absent from current NotificationMethodHandler; no fake path added
    by this revision
  ai.extract: reserved; no new implementation in cloud sync 02
evidence_status: schema_and_graph_only_runtime_owner_implementation_belongs_to_03_04_05_06
