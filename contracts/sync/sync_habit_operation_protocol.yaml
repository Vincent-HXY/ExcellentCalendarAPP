version: 1
version_domain: sync_protocol/v1
implementation_status: planned
release_status: planned
rule_anchor: cloud-sync-01/9.3; cloud-sync-02/7.1-7.3,7.7,10-11
operation_identity:
  scope: [authenticated_account, operation_id]
  digest: SHA256_RFC8785_of_protocol_version_target_type_target_id_operation_type_payload
  excluded: [mutation_id, client_sequence, base_entity_version, causal_predecessors, conflict_recovery_snapshot, created_at]
  first_attempt: retain_identity_and_digest_even_when_business_rejected
  changed_identity_or_content: terminal_rejected_SYNC_HABIT_OPERATION_ID_REUSED_with_operation_id_zero_business_write
  applied_retry: accepted_no_effect_reference_original_group_without_new_success_anchor
  rejected_retry: same_frozen_operation_may_be_adjudicated_at_new_sequence_and_base
  retention: until_account_deletion_independent_of_mutation_receipt_cleanup
operations:
  increment:
    merge_keys: [completion, deleted_at, snapshot]
    quantity: add_positive_delta
    concurrent_additive_operations: commute_if_result_is_representable
  decrement:
    merge_keys: [completion, deleted_at, snapshot]
    quantity: subtract_positive_delta
    concurrent_additive_operations: commute_if_result_is_representable
  replace_total:
    merge_keys: [completion, deleted_at, note, snapshot]
    quantity: exact_typed_fact
    barrier: completion_version
  clear:
    merge_keys: [completion, deleted_at]
    quantity: preserve_last_valid_fact_under_tombstone
    barrier: completion_version
write_set:
  meaning: possible_semantic_write_set_of_the_frozen_operation_not_just_different_scalar_values
  unchanged_dependency: no_effect_inherits_verified_prior_anchor
  clear_completion: semantic_barrier_advances_with_tombstone_even_though_retained_positive_quantity_is_unchanged
  first_row: initialize_all_registry_groups_zero_then_advance_operation_groups_actually_written
  first_check_in_guard: server_generated_parent_Habit_after_image_in_same_transaction_and_group
  first_check_in_guard_receipt: not_a_client_authored_key_or_an_independent_outbox_mutation
quantity:
  storage: integer_hundredths_1_through_9007199254740991
  binary_or_skipped_increment: binary_rejected_skipped_quantity_habit_starts_from_zero_with_frozen_snapshot
  zero_underflow_overflow: terminal_rejected_HABIT_CHECK_IN_STATE_INVALID_preserve_intent_for_explicit_repair
  zero_is_not_clear: only_explicit_clear_creates_tombstone_no_clamping_wraparound_or_hidden_negative_debt
  commutativity_scope: independent_additive_operations_with_no_unseen_replace_clear_barrier_and_representable_intermediate_totals
snapshot:
  quantity: exact_parent_locked_target_and_unit_values
  skipped: null_target_unit_quantity_and_completed_at
  clear: retain_snapshot_and_created_at_and_positive_quantity
  recreate: same_logical_identity_and_original_created_at
  audit: source_and_occurred_at_follow_accepted_server_order_never_adjudicate_concurrency_by_client_clock
concurrency:
  additive: latest_nonadditive_completion_barrier_must_not_exceed_verified_completion_baseline
  replace_clear: differing_candidate_and_any_later_touched_group_competes
  unresolved_check_in_or_parent: terminal_rejected_SYNC_ENTITY_CONFLICT_BLOCKED
  deleted_parent: terminal_rejected_HABIT_TARGET_DELETED
  inactive_or_ended_parent: terminal_rejected_HABIT_ALREADY_ENDED
  same_value: accepted_no_effect_without_new_barrier_group_or_success_anchor
validation_owners:
  core_writer: current_device_IANA_timezone_today_and_parent_date_readonly_rules_before_fact_outbox_transaction
  backend: exact_wire_identity_snapshot_parent_lifecycle_and_causal_barrier_under_account_device_fact_locks
  backend_forbidden: trust_diagnostic_client_timestamp_as_current_time_or_expand_recurrences
transaction: [operation_binding, fact_and_field_versions, parent_history_guard, change_group, successful_operation_effect, terminal_receipt, device_sequence]
