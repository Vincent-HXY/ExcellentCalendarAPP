version: 1
version_domain: sync_protocol/v1
implementation_status: planned
release_status: planned
rule_anchor: cloud-sync-02/5-12

hash:
  algorithm: SHA-256
  canonicalization: RFC8785
  encoding: UTF-8
  wire: lowercase_hex_64
  mutation_input: all_exact_mutation_envelope_fields_except_top_level_created_at
  upload_item: sync_hashed_mutation.schema.json
  diagnostic_exclusions: [created_at]
  no_normalization: [Unicode_NFC, Unicode_NFD, timezone_reinterpretation, array_sorting]
  integer_validation: sync_counter_registry.yaml
  reject_before_hash: [duplicate_object_keys, malformed_UTF8, unpaired_surrogates, nonfinite_numbers, unsafe_integers, unknown_fields]

transaction:
  lock_order: [authenticated_session, user_devices, sync_device_state, sync_account_sequences, import_lineage, typed_facts]
  principal_scope: account_id_from_authenticated_session_only
  transport_generation: revalidate_under_device_lock_before_any_state_write
  request_error: zero_business_receipt_and_sequence_writes
  replay_mismatch: device_blocked_metadata_only_zero_business_receipt_and_sequence_writes
  infrastructure_error: rollback_entire_exchange
  terminal_receipts: [accepted, partially_merged, conflict, rejected, staged]
  duplicate: exact_original_terminal_receipt_including_effect_and_per_key_results
  result_consumes_sequence: all_terminal_receipts
  staged_allowed_for: [import_begin, import_put, import_delete]
  successful_import_commit: accepted_with_server_confirmed_metadata
  import_commit_result: sync_import_commit_result.schema.json
  import_commit_success: exact_effect_publish_group_commit_sequence_digest_and_import_revision_no_local_publication
  import_commit_repair: rejected_with_typed_error_and_next_revision_greater_than_expected_revision_zero_canonical
  import_terminal_validation: bind_result_to_frozen_mutation_receipt_batch_and_operation_before_ack
  import_identity_fenced_terminal: abandoned_or_superseded_stable_rejection_never_repair_or_publish
  dispatch_order: [import_identity_fence, import_range_reservation, replay, contiguous_sequence, business_adjudication]

causal:
  habit_operation_rules: sync_habit_operation_protocol.yaml
  key: [device_id, target_type, target_id, merge_key]
  predecessor_order: ascending_UTF16_merge_key
  predecessor_set: exactly_actual_touched_merge_keys
  predecessor_sequence: null_or_strictly_less_than_current_sequence
  accepted_evidence: [successful_key_receipt, compact_successful_key_anchor, validated_terminal_no_effect_receipt]
  rejected_evidence: [staged, request_error, other_device, other_target, other_merge_key, future_sequence, unverified_chain]
  anchor_advance: accepted_or_partially_merged_and_key_actually_applied_only
  no_effect: inherit_previously_validated_effective_sequence_and_version_without_advancing_anchor
  concurrent: current_field_version_newer_than_verified_baseline_and_values_differ
  matching_value: accepted_no_effect_without_new_group_or_anchor
  pending_predecessor_pin: ack_watermark_stops_before_earliest_referenced_terminal_sequence
  immutable: [prepared_sequence, sent_sequence, mutation_id, typed_payload, payload_hash, causal_predecessors]

owned_dependencies:
  rule_anchor: cloud-sync-02/7.1-7.3
  status: draft_requires_owned_graph_evidence
  location: target_specific_payload.owned_dependencies
  recursive_dependencies: forbidden
  maximum: 2
  allowed_edges:
    event: [event_recurrence, reminder_intent]
    anniversary: [anniversary_recurrence, reminder_intent]
    habit: [habit_recurrence, reminder_intent]
    reminder_intent: [event, event_recurrence]
  ownership: exact_parent_reference_or_reminder_owner_identity_in_same_candidate_graph
  ordering: ascending_target_type_then_target_id
  receipt_key: [target_type, target_id, merge_key]
  coherence_components:
    event_schedule: [event.timing, event.recurrence_link, event_recurrence.complete_immutable_revision, reminder_intent.schedule]
    anniversary_date_rule: [anniversary.date_rule, anniversary_recurrence.complete_immutable_rule]
    habit_creation: [habit.complete_create, habit_recurrence.complete_immutable_rule, reminder_intent.schedule]
  concurrent_member: preserve_entire_component_candidate_do_not_publish_partial_component
  unrelated_root_key: may_auto_merge_if_post_merge_graph_remains_valid
  conflicting_revision: never_overwrite_existing_recurrence_tuple_or_attach_different_content
  restore_or_resolution_revision: Core_allocates_new_revision_from_latest_accepted_snapshot_in_a_new_mutation
  old_frozen_dependent_intent: preserve_as_failed_local_change_if_reference_proof_cannot_be_satisfied
  scope_limit: no_unrelated_targets_no_import_lifecycle_no_recursive_arbitrary_transaction

ack_apply:
  upload_ack_transaction: [terminate_exact_outbox, persist_terminal_receipt, advance_successful_causal_anchors,
    persist_awaiting_effect_gate, preserve_rejected_typed_intent, compute_pinned_ack_watermark]
  forbidden_during_ack: [publish_server_fact, publish_conflict, create_notice, update_visible_cursor]
  writer_gate_error: SYNC_ENTITY_SYNC_EFFECT_PENDING
  normal_apply_transaction: [validate_exact_group, publish_fact_and_conflict_lifecycle, persist_group_receipt,
    remove_matching_effect_gate, advance_visible_cursor]
  ack_only_transaction: [verify_exact_prepared_identity_and_watermark, advance_server_accepted_watermark, derive_dirty]
  ack_only_forbidden_writes: [fact, conflict, cursor, account_generation, cleanup_watermark]
  successful_run_requires: [all_pages_committed, local_ack_equals_server_accepted_ack, lifecycle_journal_finished]
  failed_local_change: device_local_not_outbox_not_automatic_retry

limits:
  status: candidate_wire_caps_require_maximum_fixture_calibration
  decompressed_request_hard_bytes: 1048576
  upload_mutations_max: 100
  download_top_level_items_max: 500
  mutation_hard_bytes: 262144
  ordinary_group_soft_bytes: 524288
  ordinary_group_hard_bytes: 2097152
  import_chunk_hard_bytes: 1048576
  bootstrap_item_hard_bytes: 2097152
  response_soft_bytes: 1048576
  response_hard_bytes: 4194304
  response_envelope_reserved_bytes: 65536
  soft_oversize: legal_single_item_or_ordinary_group_gets_exclusive_page
  hard_oversize: terminal_rejected_SYNC_CHANGE_GROUP_TOO_LARGE_before_canonical_write
  import_batch_items: 50000
  import_batch_canonical_bytes: 134217728
  account_nonterminal_batches: 2
  account_staging_items: 100000
  account_staging_canonical_bytes: 268435456
  source_uploadable_batches: 1

cursor:
  private_authenticated_encoding: sync_cursor_protocol.yaml
  opaque_schema: sync_exchange_request.schema.json
  authentication: Backend_HMAC_with_key_id
  bindings: [principal_account, device_id, protocol_version, account_generation, snapshot_upper_bound, covered_server_sequence]
  client_interpretation: forbidden
  bootstrap_only_for: [SYNC_CURSOR_EXPIRED, SYNC_CURSOR_GENERATION_MISMATCH]
  fail_closed_for: [SYNC_CURSOR_INVALID, SYNC_CURSOR_ACCOUNT_MISMATCH, SYNC_CURSOR_DEVICE_MISMATCH]
  old_key_retirement: all_issued_ranges_below_retention_floor_or_old_generation_and_all_referencing_bootstrap_sessions_expired

bootstrap:
  hash_and_page_rules: sync_bootstrap_protocol.yaml
  materialization: short_creation_transaction_immutable_session_and_items
  ttl_seconds: 86400
  initial_request: bootstrap_cursor_null
  identity: [account, device, protocol_version, transport_generation, account_generation, snapshot_upper_bound,
    device_highest_client_sequence_at_snapshot, device_client_confirmed_through_at_snapshot, cleanup_watermarks, expiry,
    snapshot_item_count, snapshot_items_hash, total_page_count, page_item_limit]
  reuse: identity_generation_highest_and_confirmed_unchanged_only
  order: [kind, target_type, target_id, conflict_id, merge_key, ordinal]
  publication: complete_pages_graph_hash_markers_and_causal_anchors_then_single_Native_transaction
  fresh_allocator: validated_highest_plus_one_or_exhausted_null
  existing_allocator: monotonic_validation_never_overwrite_pending_outbox

import:
  rules: [IMP-01, IMP-02, IMP-03, IMP-04, IMP-05, IMP-06, IMP-07, IMP-08, IMP-09, IMP-10, IMP-11, IMP-12]
  source_lease_key: source_workspace_id
  source_epoch: independent_from_snapshot_hash_and_account
  outbox_routes: [import_begin, import_put, import_delete, import_commit]
  independent_HTTP_CAS: [import_takeover, import_abandon, import_cleanup_confirm]
  immutable_reservation: begin_then_exact_ordinal_range_then_terminal_commit
  ttl: reclaim_payload_only_preserve_range_lineage_receipts_and_recovery
  visibility: only_complete_canonical_publish_group_or_verified_bootstrap_marker
  source_retirement: whole_graph_compare_and_retire_after_publish_applied
  max_source_epoch: retire_and_cleanup_then_disable_future_import

retention:
  tombstone_days: 180
  receipt_minimum_days: 180
  unresolved_conflict: unlimited_and_pins_tombstone
  resolved_conflict_days: 30
  deleted_entity_anchor: until_account_deletion_without_business_payload
  import_mapping_and_publish_marker: until_account_deletion
  receipt_cleanup: age_and_client_confirmed_watermark_and_effect_and_causal_pins
  notice_cleanup: claimed_prefix_watermark_only_preserve_current_head_and_active_discovery

retry:
  rule_anchor: cloud-sync-02/12
  owner: kotlin.sync_transport_coordinator
  attempt_origin: 0
  algorithm: full_jitter_uniform_0_to_min_900_seconds_5_seconds_times_2_power_attempt
  maximum_consecutive_automatic_attempts: 8
  retry_after_seconds: {minimum: 1, maximum: 86400}
  delay_with_valid_hint: min_86400_max_jitter_and_hint
  compatible_header: optional_same_integer_Retry_After_only
  header_body_mismatch: invalid_envelope_no_retry
  reset_budget: [successful_exchange, explicit_user_run, offline_to_online, foreground_after_at_least_1800_seconds]
  budget_exhausted: retryable_failed
  retryable_transport_failures: [DNS, timeout, temporary_connection_failure]
  retryable_http_statuses: [429, 500, 502, 503, 504]
  never_retry: [certificate_validation, hostname_validation, unknown_enum, invalid_business_envelope, contract_corruption, sequence_mismatch]
  manual_run_cannot_bypass_permanent_classification: true
