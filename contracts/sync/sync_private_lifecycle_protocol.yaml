protocol_version: 1
rule_anchor: cloud-sync-02/7.6/IMP-08,IMP-10;8.2;13
implementation_status: planned
release_status: planned
crypto_destroy_final_receipt:
  owner: Kotlin WorkspaceLifecycle
  schema: workspace/private/crypto_destroy_final_receipt.schema.json
  storage: installation-scoped Keystore AEAD journal in noBackupFilesDir, retained until bound lease is finalized
  aad: [record_kind, installation_id, account_id, workspace_id, schema_version]
  finalization_order:
    - persist operation-bound intent and exact account/workspace/device/key/source/lineage/batch identity
    - block writers, detach and close native runtime, zero transient key buffers
    - delete and verify absence of account Keystore aliases and wrapped keys, including remote-device cache key
    - atomically persist final receipt, then allow bounded ciphertext file cleanup
  hash: SHA-256 of RFC8785 final receipt; hash is a lookup key, never proof by itself
  acceptance:
    - trusted lifecycle owner must authenticate the local journal and match every binding
    - C++ never accepts caller-provided booleans, an arbitrary hash, a missing DB or a missing key as a final receipt
    - Backend abandoned proof must verify and lineage_ever_published must be false
    - exact lease epoch, lineage, batch, manifest, owner digest and expected lease revision must still match
    - unconfirmed abandon keeps the lease even after immediate privacy destruction
  exposure: only the bound final receipt hash crosses the private owner-to-guest-finalize boundary
remote_device_cache:
  schema: device/private/remote_snapshot_cache.schema.json
  storage: account/workspace-scoped Android Keystore AES-256-GCM, atomic private file
  aad: [remote_device_snapshot, installation_id, account_id, workspace_id, schema_version]
  nonce_bytes: 12
  tag_bits: 128
  nonce_owner: OS SecureRandom, fresh on every write
  query: authenticate current active account/workspace/device binding before decrypt; offline cache is stale
  invalidation: logout, switch-account, revoke, clear and account crypto-destroy detach cached content immediately
  ordinary_index_allowed: [schema_version, cache_present, freshness]
  backup: exclude from all cloud backup and direct device transfer
diagnostics:
  schema: sync/diagnostic_export_payload.schema.json
  journal_schema: sync/private/diagnostic_export_journal.schema.json
  ttl_seconds: 900
  clock: monotonic elapsed time bound to boot identity; unknown or changed boot expires immediately
  file: generated export_id under dedicated app cache directory, no caller-controlled path
  share: Android FileProvider content URI, temporary read grant, no public file path or payload in MethodChannel response
  cleanup: on share completion or fixed TTL; startup also expires old/unknown-boot entries and revokes URI grants
  failure: remove partial file, return SYNC_DIAGNOSTIC_EXPORT_FAILED, no sync/notice/policy mutation
  forbidden: [title, business_payload, conflict_candidate, token, cursor, account_id, device_id, directory, key_alias]
