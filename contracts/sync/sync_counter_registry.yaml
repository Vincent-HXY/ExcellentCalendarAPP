registry_version: 1
release_status: planned
rule_anchor: cloud-sync-02/6.1
maximum: 9007199254740991
wire_type: integer
wire_number_interpretation: RFC8785_binary64_mathematical_integer_exactly_in_safe_range_normalized_to_integer_before_CAS_or_hash_identity
integral_decimal_or_exponent_notation: accepted_as_the_same_integer
booleans_strings_nonfinite_and_fractional_values: rejected
allocation_rules:
  - Validate the integer domain before any conversion or arithmetic.
  - One owner transaction compares the current value, checks remaining range, and commits the value with its facts and receipt.
  - Exact operation replay checks the immutable receipt before exhaustion; it never increments again.
  - An operation identifier reused for a different input is rejected before any write.
  - A stale CAS is rejected before exhaustion handling; no caller can overwrite another owner's value.
  - No timestamp, fresh identifier, saturation or wraparound substitutes for an exhausted counter.
  - Counter exhaustion metadata is distinct from a successful business write.
  - An already committed lifecycle journal may finish under its original revision without allocating another revision.
