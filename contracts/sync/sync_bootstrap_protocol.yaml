version: 1
version_domain: sync_protocol/v1
implementation_status: planned
release_status: planned
rule_anchor: cloud-sync-02/6.3,10-11
hashes:
  canonicalization: RFC8785_JCS_UTF8
  algorithm: SHA256_lowercase_hex
  snapshot_items_hash: entire_ordered_materialized_items_array
  page_hash: entire_page_response_object_omitting_only_page_hash
  page_set_digest: ordered_array_of_exact_objects_with_page_ordinal_and_page_hash
  snapshot_provenance_digest: ordered_array_of_exact_objects_with_target_type_target_id_import_provenance_for_matching_source_workspace_epoch_and_lineage
  provenance_order: UTF16_target_type_then_target_id
pagination:
  item_order: sync_protocol_invariants.yaml#/bootstrap/order
  page_item_limit: first_request_download_limit_frozen_in_session_and_echoed_in_all_pages
  changed_limit_on_null_request: supersede_session_and_materialize_new_session
  changed_limit_on_continuation: SYNC_PAYLOAD_INVALID
  packing: consecutive_items_first_fit_by_count_and_canonical_response_soft_cap
  over_soft_single_item: alone_if_within_item_and_response_hard_caps
  page_envelope_reservation_bytes: 65536
  page_hash_excluded_from_budget: false
  empty_snapshot: one_empty_terminal_page
  ordinal_origin: 0
  terminal: page_ordinal_equals_total_page_count_minus_one_and_complete_item_count_and_hash
  session_identity: immutable_after_materialization_only_superseded_at_may_advance
local_acceptance:
  input: matching_runtime_binding_and_authenticated_HTTP_transport
  cursor_decoding: forbidden
  page_replay: same_bootstrap_id_ordinal_page_hash_and_request_cursor_returns_previous_staging_receipt
  incomplete_or_out_of_order: SYNC_BOOTSTRAP_INCOMPLETE
  snapshot_visibility: zero_live_rows_until_complete_atomic_finalize
  finalize: validate_complete_graph_conflicts_provenance_markers_causal_anchors_then_rebase_pending_and_applicable_failed_overlays
  fresh_ack: highest_client_sequence_at_snapshot_only_after_complete_finalize
  existing_ack: never_skip_pending_outbox_or_unapplied_effect_gate
  cleanup_watermarks: accept_only_nondecreasing_same_generation_otherwise_do_not_cleanup
