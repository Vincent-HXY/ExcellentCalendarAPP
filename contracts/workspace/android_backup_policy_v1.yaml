version: 1
implementation_status: planned
release_status: planned
rule_anchor: cloud-sync-02/4.1,4.2
manifest:
  allowBackup: false
  fullBackupContent: '@xml/backup_rules'
  dataExtractionRules: '@xml/data_extraction_rules'
legacy_api23:
  excluded_domains:
  - root
  - file
  - database
  - sharedpref
  - external
  path: .
legacy_api24_to30:
  excluded_domains:
  - root
  - file
  - database
  - sharedpref
  - external
  - device_root
  - device_file
  - device_database
  - device_sharedpref
  path: .
api31_plus:
  cloud_backup:
    excluded_domains:
    - root
    - file
    - database
    - sharedpref
    - external
    - device_root
    - device_file
    - device_database
    - device_sharedpref
    path: .
  device_transfer:
    excluded_domains:
    - root
    - file
    - database
    - sharedpref
    - external
    - device_root
    - device_file
    - device_database
    - device_sharedpref
    path: .
rules:
  guest_and_account: both excluded, including files-based DB/WAL/SHM and legacy JSON;
    do not rely only on database domain
  protected_material: all registry, wrapped keys, Broker tokens, leases/seeds/journals,
    boot/retention/proof-revocation state and caches excluded
  api23_compatibility: device-protected domains are introduced through resource qualifier
    xml-v24, not supplied to the API23 parser
  default_include: false
  direct_transfer_exception: false
  manufacturer_d2d: verify actual device behavior separately; allowBackup false alone
    is insufficient
primary_sources:
- https://developer.android.com/identity/data/autobackup
product_manifest_activated: false
