name: ${COMPOSE_PROJECT_NAME:-excellent-calendar-cloud}

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-excellent_calendar}
      POSTGRES_USER: ${POSTGRES_USER:-excellent_calendar}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      PGTZ: UTC
      TZ: UTC
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-excellent_calendar} -d ${POSTGRES_DB:-excellent_calendar}"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data

  api:
    profiles: ["app"]
    build:
      context: .
    environment:
      SPRING_PROFILES_ACTIVE: api
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-excellent_calendar}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-excellent_calendar}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only-change-me}
      SERVER_PORT: 8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8080}:8080"

volumes:
  postgres-data:
