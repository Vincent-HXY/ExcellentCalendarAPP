spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/excellent_calendar}
    username: ${SPRING_DATASOURCE_USERNAME:excellent_calendar}
    password: ${SPRING_DATASOURCE_PASSWORD:local-dev-only-change-me}

server:
  port: ${SERVER_PORT:8080}

excellent-calendar:
  security:
    jwt:
      # Local development only: 48 random bytes (Base64). Never use outside `local`.
      secret: ${EXCELLENT_CALENDAR_SECURITY_JWT_SECRET:bG9jYWwtZGV2LW9ubHktY2hhbmdlLW1lLWxvY2FsLWRldi1vbmx5LWNoYW5nZS1tZQ==}
