spring:
  application:
    name: excellent-calendar-cloud-backend
  profiles:
    default: api
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    hikari:
      maximum-pool-size: ${DATABASE_POOL_MAX_SIZE:10}
      minimum-idle: ${DATABASE_POOL_MIN_IDLE:1}
      connection-timeout: 5s
      validation-timeout: 3s
      connection-init-sql: SET TIME ZONE 'UTC'
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    clean-disabled: true
    baseline-on-migrate: false
    validate-on-migrate: true

server:
  shutdown: graceful
  error:
    include-binding-errors: never
    include-exception: false
    include-message: never
    include-stacktrace: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

logging:
  pattern:
    level: "%5p [request_id:%X{request_id:-}]"

# ---------------------------------------------------------------------------
# Identity / Auth
# ---------------------------------------------------------------------------
excellent-calendar:
  identity:
    jwt-secret: ${EXCELLENT_CALENDAR_IDENTITY_JWT_SECRET:change-me-to-a-secret-at-least-32-characters}
    mail-enabled: ${EXCELLENT_CALENDAR_IDENTITY_MAIL_ENABLED:false}
    app-base-url: ${EXCELLENT_CALENDAR_IDENTITY_APP_BASE_URL:http://localhost:8080}
    mail-from: ${EXCELLENT_CALENDAR_IDENTITY_MAIL_FROM:noreply@excellentcalendar.app}
    access-token-expiration: 15m
    refresh-token-expiration: 30d
    verification-code-expiration: 15m
    password-reset-expiration: 30m
    email-change-expiration: 15m
    verification-code-max-per-window: 3
    verification-code-window: 10m
